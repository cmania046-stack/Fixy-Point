<div class="load-container" style="display: none;">

</div>

</div>

<script src="helper_function.js"></script>
<script>
const berhasil = "✅ Berhasil";
const gagal = "❌ Gagal";
const error = "⛔ Error";
const pesanGagal = "Terjadi kesalahan saat mengunggah data.";
const confirm = "❓Konfirmasi";

let idDevice;
let user;
let inisialCode;
let status;
let formatUang = ["Rp", "kiri", ".", ",", "2"];

const rootStyle = getComputedStyle(document.documentElement);
const primary = rootStyle.getPropertyValue("--primary").trim();
const primarySoft = rootStyle.getPropertyValue("--primary-soft").trim();
const kiriBg = rootStyle.getPropertyValue("--kiri-bg").trim();
const border = rootStyle.getPropertyValue("--border").trim();

const judulAtas = document.getElementById("judul-atas");
judulAtas.style.marginLeft = "10px";
document.getElementById("tengah").style.overflowX = "auto";

async function prepareIdDevice() {
	const idev = localStorage.getItem("id_device") ?? "";
	if (!idev.length) {
		const id = await getDt("make_id_device");
		localStorage.setItem("id_device", id.id);
		idDevice = id.id;		
	}
	idDevice = idev;
}

async function postDataKedua(endpoint, data) {
	showPopupLoading();
	try {
		const res = await fetch(url + "post_data/" + endpoint, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify(data),
				credentials: "include"
		});
		const d = await res.json();
		hidePopupLoading();
		return d;
	} catch (error) {
		hidePopupLoading();
		mainkanBeep(300,0.3);
		await modalShow(gagal, "Gagal upload data ke server");
		return null;
	};
}

async function postData(endpoint, data) {
	showPopupLoading();
	try {
		const res = await fetch(url + endpoint, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify(data),
				credentials: "include"
		});
		const d = await res.json();
		hidePopupLoading();
		return d;
	} catch (error) {
		hidePopupLoading();
		mainkanBeep(300,0.3);
		await modalShow(gagal, "Gagal upload data ke server");
		return null;
	};
}

async function getDt(endpoint) {
	try {
		const response = await fetch(url + endpoint, {
			method: "GET",
			credentials: "include"
		});
		const data = await response.json();
		return data;
	} catch (e) {
		await modalShow(error, e);
		return null
	}
}

async function getData(endpoint, cache=false) {
	showPopupLoading(`Menyiapkan data ${endpoint.replace(/_/g, " ")}...`);
	try {
		const URL = `lihat_data_invest?tabel=${encodeURIComponent(endpoint)}`;
		const res = await fetch(url + URL, {
			method: "GET",
			headers: {
				"Accept": "application/json"
			},
			credentials: "include"
		});
		if (res.status === 401) {
			hidePopupLoading();
			return [];
		}
		const data = await res.json();
		if (cache) localStorage.setItem(endpoint, JSON.stringify(data));
		hidePopupLoading();
		return data;
	} catch {
		hidePopupLoading();
		await modalShow(gagal, "Koneksi server tidak aktif. Data memakai cadangan data", false);
		const data = localStorage.getItem(endpoint);
		return data ? JSON.parse(data) : [];
	}
}



class Login {
	constructor() {
		this.data = null;
	}
	
	makeJudul(teks, parent) {
		const jdl = makeLabel(teks, "jdl", parent);
		jdl.style.alignSelf = "center";
		jdl.style.fontSize = "24px";
		jdl.style.fontWeight = "700";
		jdl.style.color = "#1a1a1a";
		jdl.style.letterSpacing = "1px";
		jdl.style.marginBottom = "10px";
	}
	
	makeTombol(teks, parent) {
		const btn = makeButton("invisible-btn", teks, null, null, parent);
		btn.style.display = "block";
		btn.style.textAlign = "center";
		return btn;
	}
	
	async validasi(form){
		const id = localStorage.getItem("id_device");
		const us = form.username.value.trim();
		const pw = form.password.value;
		const hasil = await postDataKedua("periksa_login_web", {username: us, password: pw, idDevice: id});
		if (hasil.stat.toLowerCase() == "berhasil"){
			user = hasil.nama;
			inisialCode = hasil.id;
			status = hasil.status;
			setButtonBawah();
			dash.setup();
		} else {
			await modalShow(hasil.stat, hasil.pesan);
		}
	}
	
	buildFrames() {
		const p = makeParent("container", this.tengah);
		p.style.width = "100%";
		p.style.height = "100%";
		p.style.justifyContent = "center";
		p.style.alignItems = "center";
		p.style.backgroundColor = "transparent";
		p.style.border = "none";
		
		const logParent = makeParent("container", p);
		logParent.style.backgroundColor = "#ffffff";
		logParent.style.borderRadius = "12px";
		logParent.style.boxShadow = "0 8px 24px rgba(0, 0, 0, 0.3)";
		logParent.style.padding = "40px 30px";
		logParent.style.gap = "5px";
		logParent.style.width = "90%";
		logParent.style.maxWidth = "400px";
		logParent.style.border = "none";
		
		this.makeJudul("LOGIN FORM", logParent);
		const form = this.pembuatHalamanLogin(logParent);
		form["username"].focus();
		form["password"].addEventListener("keydown", (e) => {
			if (e.key === "Enter") this.validasi(form);
		});
		const btnLogin = makeButton("btn", "Login", () => this.validasi(form), null, logParent);
	}
	
	pembuatHalamanLogin(p) {
		makeLabel("Username", "teks", p);
		const us = entryMaker("Masukkan nama pengguna...", "text", "Pictures/username.png", p);
		makeLabel("Password", "teks", p);
		const [prt, pw] = pwMaker("Masukkan kata sandi...", "password", "Pictures/eyebrow.png", p);
		const img = prt.querySelector("img");
		img.onclick = () => {
			if (pw.type === "password") {
				img.src = "Pictures/see.png";
				pw.type = "text";
			} else {
				img.src = "Pictures/eyebrow.png";
				pw.type = "password";
			}
		}
		return { username: us, password: pw }
	}
	
	async setup() {
		resetJudul("HALAMAN LOGIN");
		this.tengah = document.getElementById("tengah");
		this.tengah.innerHTML = "";
		this.buildFrames();
	}
}

class Dashboard {
	tampilkanSaham() {
		this.tengah.innerHTML = "";
		const atas = makeParent("container", this.tengah);
		const bawah = makeParent("container", this.tengah);
		const totalModal = this.dataSaham.reduce((item, b) => item + b.saldo,0);
		makeLabel(`Total keseluruhan investasi: ${formatMataUang(totalModal)}`, "label-data", atas);
		
		const namaInvestor = [], persenSaham = [];
		for (const p of this.dataSaham) {
			namaInvestor.push(p.nama);
			const persentase = p.saldo / totalModal * 100;
			persenSaham.push(Math.round(persentase));
		}	
		pieMaker(atas, "Persentase saham", "Persentase saham investor", namaInvestor, persenSaham);
		
		const tabel = makeTable(`
			<tr>
				<th>Id investor</th>
				<th>Nama investor</th>
				<th>Saldo investasi</th>
				<th>Profit tersedia</th>
				<th>Tanggal update</th>
				<th>Keterangan</th>
			</tr>
		`);
		bawah.appendChild(tabel);
		for (const item of this.dataSaham) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.id_investor}</td>
				<td>${item.nama}</td>
				<td>${formatMataUang(item.saldo)}</td>
				<td>${formatMataUang(item.profit)}</td>
				<td>${item.tanggal_update}</td>
				<td>${item.keterangan}</td>
			`;
			tabel.appendChild(tr);
		}
	}
	
	async setup() {
		resetJudul("BERANDA")
		this.tengah = document.getElementById("tengah");
		this.tengah.innerHTML = "";
		this.dataSaham = await getData("data_saham");
		this.tampilkanSaham();
	}
}

class Investor {
	setAtas() {
		this.cari = entryMaker("Masukkan nama...", "text", "Pictures/cari.png", this.atas);
		newmakeButton(this.atas, "btn", "Tambah investor", "Pictures/add.png", () => this.tambahInvestor());
	}
	
	tambahInvestor() {
		const parent = pembuatJendela();
		makeButton("invisible-btn", "Investor baru", null, "Pictures/edit.png", parent);
		const info = pembuatEntry(parent, [
			["nama", "Masukkan nama investor...", "text"],
			["alamat", "Masukkan alamat...", "text"],
			["kontak", "Masukkan nomor telepon / Whatsapp...", "number"],
			["email", "Masukkan email...", "email"],
			["informasi rekening", "Masukkan nama bank dan nomor rekening...", "text"],
			["catatan", "Masukkan catatan...", "text"]
		]);
		
		newmakeButton(parent, "btn", "Simpan", null, async () => {
			const hasil = pecahObject(info);
			if (kosong(hasil.nama) ||
				kosong(hasil.kontak) ||
				kosong(hasil.email)
			) {
				await modalShow(gagal, "Nama, kontak, dan email harus diisi");
				return;
			}
			if (await modalShow(confirm, `Data siap. Simpan investor ${hasil.nama} sekarang?`)) {
				const res = await postDataKedua("tambah_investor", hasil);
				await message(res);
				this.setup();
			}
		});
	}
	
	async setBawah() {
		this.bawah.innerHTML = "";
		const tabel = makeTable(`
			<tr>
				<th>Id investor</th>
				<th>Nama</th>
				<th>Alamat</th>
				<th>Kontak</th>
				<th>Email</th>
				<th>Informasi rekening</th>
				<th>Catatan</th>
				<th>Bergabung sejak</th>
				<th>Status</th>
			</tr>
		`);
		this.bawah.appendChild(tabel);
		const data = await getData("investor");
		for (const item of data) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.id_investor}</td>
				<td>${item.nama}</td>
				<td>${item.alamat}</td>
				<td>${item.kontak}</td>
				<td>${item.email}</td>
				<td>${item.informasi_rekening}</td>
				<td>${item.catatan}</td>
				<td>${item.tanggal_gabung}</td>
				<td>${item.status}</td>
			`;
			tabel.appendChild(tr);
		}
	}
	
	setup() {
		resetJudul("INVESTOR");
		const tengah = document.getElementById("tengah");
		tengah.innerHTML = "";
		this.atas = makeParent("container-horizontal", tengah);
		this.bawah = makeParent("container", tengah);
		for (const item of [this.atas, this.bawah]) item.style.border = "none";
		this.setAtas();
		this.setBawah();
	}
}

class Saham {
	async terbitkanSaham() {
		this.atas.innerHTML = "";
		const investor = await getData("investor");
		const names = [...new Set(investor.map(p => p.id_investor + " - " + p.nama))];
		const opsi = pembuatCombo(this.atas, "- Pilih investor -", names);
		makeLabel("Modal investasi", "teks", this.atas);
		const modal = entryMaker("Masukkan jumlah modal...", "number", "Pictures/banknotes.png", this.atas);
		makeLabel("Keterangan", "teks", this.atas);
		const ket = entryMaker("Masukkan keterangan...", "text", "Pictures/edit.png", this.atas);
		this.btnTambah.textContent = "Simpan";
		this.btnTambah.onclick = async () => {
			const inv = opsi.value;
			if (inv.toLowerCase() === "- pilih investor -") {
				await modalShow(gagal, "Silahkan pilih calon pemilik saham terlebih dahulu");
				return;
			}
			const mdl = safeFloat(modal.value.trim())
			if (mdl <= 0) {
				await modalShow(gagal, "Input modal tidak valid");
				return;
			}
			const data = {
				investor: inv,
				modal: mdl,
				keterangan: ket.value.trim()
			}
			if (await modalShow(confirm, `Data telah siap. Terbitkan saham untuk ${inv} sekarang?`)) {
				const res = await postDataKedua("terbitkan_saham", data);
				await message(res);
				this.setup()
			}
		}
	}
	
	async tampilkanSaham() {
	    this.atas.innerHTML = "";
	    const dt = await getData("data_saham");
	    const data = dt.sort((a, b) => b.saldo - a.saldo);
	
	    const totalSaldo = data.reduce((sum, b) => sum + (b.saldo ?? 0), 0);
	    const pra = pembuatField(this.atas, "Tabel saldo dan profit");
	    const prm = pembuatField(this.atas, "Persentase saham");
		const tabel = makeTable(`
	    	<tr>
	    		<th>Id investor</th>
	    		<th>Nama</th>
	    		<th>Saldo</th>
	    		<th>Profit</th>
	    		<th>Persentase saham</th>
	    	</tr>
	    `);
	    pra.appendChild(tabel);
	    for (const item of data) {
	        const prt = makeParent("container", prm);
	        prt.style.border = `1px solid ${border}`;
	        prt.style.gap = "0";
	
	        const saldo = item.saldo ?? 0;
	        const persen = totalSaldo ? (saldo / totalSaldo) * 100 : 0;
	
	        const label = makeButton("invisible-btn", item.nama, null, "Pictures/investor.png", prt);
	        const prtBar = makeParent("container-horizontal", prt);
	        prtBar.style.border = "none";
	        prtBar.style.overflowX = "hidden";
	
	        await new Promise(r => requestAnimationFrame(r));
	        const max = prtBar.offsetWidth || 300;
	        const panjang = (persen / 100) * max;
	
	        const bar = document.createElement("div");
	        bar.style.height = "30px";
	        bar.style.width = `${Math.floor(panjang)}px`;
	        bar.style.background = primary;
	        bar.style.borderRadius = "5px";
	        prtBar.appendChild(bar);	
	        makeLabel(`${persen.toFixed(2)}%`, "teks", prtBar);
	        
	        const tr = document.createElement("tr");
	        tr.innerHTML = `
	        	<td>${item.id_investor}</td>
	        	<td>${item.nama}</td>
	        	<td>${formatMataUang(item.saldo)}</td>
	        	<td>${formatMataUang(item.profit)}</td>
	        	<td>${persen.toFixed(2)}%</td>
	        `;
	        tr.onclick = (e) => {
	        	const p = makeFlyParent(e);
	        	
	        }
	        tabel.appendChild(tr);
	    }
	}
	
	setup() {
		resetJudul("Pengelolaan saham");
		const tengah = document.getElementById("tengah");
		tengah.innerHTML = "";
		this.atas = makeParent("container", tengah);
		this.btnTambah = newmakeButton(tengah, "btn", "Terbitkan saham baru", null, () => this.terbitkanSaham());
		this.tampilkanSaham(); 
	}
}

function setButtonBawah() {
	const parent = document.getElementById("bawah");
	const info = [
		["Beranda", "Pictures/home.png", () => dash.setup()],
		["Investor", "Pictures/investor.png", () => investor.setup()],
		["Saham", "Pictures/saham.png", () => saham.setup()]
	]
	for (const [teks, gambar, command] of info) {
		newmakeButton(parent, "btn", teks, gambar, command);
	}
	parent.querySelectorAll("button").forEach(item => {
		item.style.display = "flex";
		item.style.flexDirection = "column";
		item.style.border = "none";
		item.style.background = "transparent";
		item.style.boxShadow = "none";
		item.style.justifyContent = "center";
		item.style.alignItems = "center";
	});
}

const login = new Login();
const dash = new Dashboard()
const investor = new Investor();
const saham = new Saham();

window.onload = async function() {
	prepareIdDevice();
	resetJudul("Manajemen keuangan dan saham");
	//login.setup();
	setButtonBawah();
	dash.setup();
	
}

</script>
