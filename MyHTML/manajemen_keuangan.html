async function prepareIdDevice() {
	const idev = localStorage.getItem("id_device") ?? "";
	if (!idev.length) {
		const id = await getDt("make_id_device");
		localStorage.setItem("id_device", id.id);
		idDevice = id.id;		
	}
	idDevice = idev;
}

async function takePictures(file="", folder="", age=86400) {
	try {
		const info = {
			file: file,
			folder: folder,
			age: age
		}
		const payload = JSON.stringify(info);
		const link = `get_all_pictures/${encodeURIComponent(payload)}`;
		const res = await fetch(url + link);
		if (!res.ok) throw new Error(`Status ${res.status}`);
		const blob = await res.blob();
		return URL.createObjectURL(blob);
	} catch (er) {
		await modalShow(error, er);
		return null;
	}
}

async function postDataKedua(endpoint, data) {
	showPopupLoading();
	try {
		const res = await fetch(url + "post_data/" + endpoint, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify(data),
				credentials: "include"
		});
		const d = await res.json();
		hidePopupLoading();
		return d;
	} catch (error) {
		hidePopupLoading();
		mainkanBeep(300,0.3);
		await modalShow(gagal, "Gagal upload data ke server");
		return null;
	};
}

async function postData(endpoint, data) {
	showPopupLoading();
	try {
		const res = await fetch(url + endpoint, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify(data),
				credentials: "include"
		});
		const d = await res.json();
		hidePopupLoading();
		return d;
	} catch (error) {
		hidePopupLoading();
		mainkanBeep(300,0.3);
		await modalShow(gagal, "Gagal upload data ke server");
		return null;
	};
}

async function getDt(endpoint) {
	try {
		const response = await fetch(url + endpoint, {
			method: "GET",
			credentials: "include"
		});
		const data = await response.json();
		return data;
	} catch (e) {
		await modalShow(error, e);
		return null
	}
}

async function getData(endpoint, cache=false, target="lihat_data_invest") {
	showPopupLoading(`Menyiapkan data ${endpoint.replace(/_/g, " ")}...`);
	try {
		const URL = `${target}?tabel=${encodeURIComponent(endpoint)}`;
		const res = await fetch(url + URL, {
			method: "GET",
			headers: {
				"Accept": "application/json"
			},
			credentials: "include"
		});
		if (res.status === 401) {
			hidePopupLoading();
			return [];
		}
		const data = await res.json();
		if (cache) localStorage.setItem(endpoint, JSON.stringify(data));
		hidePopupLoading();
		return data;
	} catch {
		hidePopupLoading();
		await modalShow(gagal, "Koneksi server tidak aktif. Data memakai cadangan data", false);
		const data = localStorage.getItem(endpoint);
		return data ? JSON.parse(data) : [];
	}
}



class Login {
	constructor() {
		this.data = null;
	}
	
	makeJudul(teks, parent) {
		const jdl = makeLabel(teks, "jdl", parent);
		jdl.style.alignSelf = "center";
		jdl.style.fontSize = "24px";
		jdl.style.fontWeight = "700";
		jdl.style.color = "#1a1a1a";
		jdl.style.letterSpacing = "1px";
		jdl.style.marginBottom = "10px";
	}
	
	makeTombol(teks, parent) {
		const btn = makeButton("invisible-btn", teks, null, null, parent);
		btn.style.display = "block";
		btn.style.textAlign = "center";
		return btn;
	}
	
	async validasi(form){
		const id = localStorage.getItem("id_device");
		const us = form.username.value.trim();
		const pw = form.password.value;
		const hasil = await postDataKedua("periksa_login_web", {username: us, password: pw, idDevice: id});
		if (hasil.stat.toLowerCase() == "berhasil"){
			user = hasil.nama;
			inisialCode = hasil.id;
			status = hasil.status;
			setButtonBawah();
			dash.setup();
		} else {
			await modalShow(hasil.stat, hasil.pesan);
		}
	}
	
	buildFrames() {
		const p = makeParent("container", this.tengah);
		p.style.width = "100%";
		p.style.height = "100%";
		p.style.justifyContent = "center";
		p.style.alignItems = "center";
		p.style.backgroundColor = "transparent";
		p.style.border = "none";
		
		const logParent = makeParent("container", p);
		logParent.style.backgroundColor = "#ffffff";
		logParent.style.borderRadius = "12px";
		logParent.style.boxShadow = "0 8px 24px rgba(0, 0, 0, 0.3)";
		logParent.style.padding = "40px 30px";
		logParent.style.gap = "5px";
		logParent.style.width = "90%";
		logParent.style.maxWidth = "400px";
		logParent.style.border = "none";
		
		this.makeJudul("LOGIN FORM", logParent);
		const form = this.pembuatHalamanLogin(logParent);
		form["username"].focus();
		form["password"].addEventListener("keydown", (e) => {
			if (e.key === "Enter") this.validasi(form);
		});
		const btnLogin = makeButton("btn", "Login", () => this.validasi(form), null, logParent);
	}
	
	pembuatHalamanLogin(p) {
		makeLabel("Username", "teks", p);
		const us = entryMaker("Masukkan nama pengguna...", "text", "Pictures/username.png", p);
		makeLabel("Password", "teks", p);
		const [prt, pw] = pwMaker("Masukkan kata sandi...", "password", "Pictures/eyebrow.png", p);
		const img = prt.querySelector("img");
		img.onclick = () => {
			if (pw.type === "password") {
				img.src = "Pictures/see.png";
				pw.type = "text";
			} else {
				img.src = "Pictures/eyebrow.png";
				pw.type = "password";
			}
		}
		return { username: us, password: pw }
	}
	
	async setup() {
		resetJudul("HALAMAN LOGIN");
		this.tengah = document.getElementById("tengah");
		this.tengah.innerHTML = "";
		this.buildFrames();
	}
}

class Dashboard {
	tampilkanSaham() {
		this.tengah.innerHTML = "";
		const atas = makeParent("container", this.tengah);
		const bawah = makeParent("container", this.tengah);
		const totalModal = this.dataSaham.reduce((item, b) => item + b.saldo,0);
		makeLabel(`Total keseluruhan investasi: ${formatMataUang(totalModal)}`, "label-data", atas);
		
		const namaInvestor = [], persenSaham = [];
		for (const p of this.dataSaham) {
			namaInvestor.push(p.nama);
			const persentase = p.saldo / totalModal * 100;
			persenSaham.push(Math.round(persentase));
		}	
		pieMaker(atas, "Persentase saham", "Persentase saham investor", namaInvestor, persenSaham);
		
		const tabel = makeTable(`
			<tr>
				<th>Id investor</th>
				<th>Nama investor</th>
				<th>Saldo investasi</th>
				<th>Profit tersedia</th>
				<th>Tanggal update</th>
				<th>Keterangan</th>
			</tr>
		`);
		bawah.appendChild(tabel);
		for (const item of this.dataSaham) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.id_investor}</td>
				<td>${item.nama}</td>
				<td>${formatMataUang(item.saldo)}</td>
				<td>${formatMataUang(item.profit)}</td>
				<td>${item.tanggal_update}</td>
				<td>${item.keterangan}</td>
			`;
			tabel.appendChild(tr);
		}
	}
	
	async setup() {
		resetJudul("BERANDA")
		this.tengah = document.getElementById("tengah");
		this.tengah.innerHTML = "";
		this.dataSaham = await getData("data_saham");
		this.tampilkanSaham();
	}

class Saham {
	async terbitkanSaham() {
		this.atas.innerHTML = "";
		const investor = await getData("investor");
		const names = [...new Set(investor.map(p => p.id_investor + " - " + p.nama))];
		const opsi = pembuatCombo(this.atas, "- Pilih investor -", names);
		makeLabel("Modal investasi", "teks", this.atas);
		const modal = entryMaker("Masukkan jumlah modal...", "number", "Pictures/banknotes.png", this.atas);
		makeLabel("Keterangan", "teks", this.atas);
		const ket = entryMaker("Masukkan keterangan...", "text", "Pictures/edit.png", this.atas);
		this.btnTambah.textContent = "Simpan";
		this.btnTambah.onclick = async () => {
			const inv = opsi.value;
			if (inv.toLowerCase() === "- pilih investor -") {
				await modalShow(gagal, "Silahkan pilih calon pemilik saham terlebih dahulu");
				return;
			}
			const mdl = safeFloat(modal.value.trim())
			if (mdl <= 0) {
				await modalShow(gagal, "Input modal tidak valid");
				return;
			}
			const data = {
				investor: inv,
				modal: mdl,
				keterangan: ket.value.trim()
			}
			if (await modalShow(confirm, `Data telah siap. Terbitkan saham untuk ${inv} sekarang?`)) {
				const res = await postDataKedua("terbitkan_saham", data);
				await message(res);
				this.setup()
			}
		}
	}
	
	async tambahProporsiSaham(d) {
		const tambahan = await modalShow("Tambahan nilai", `Masukkan tambahan nilai saham untuk ${d.nama}`, true);
		if (!tambahan) return;
		const t = safeFloat(tambahan);
		setTimeout(async () => {
			const dataTambah = {
				tambahan: t,
				data: d
			}
			if (await modalShow(confirm, "Data telah siap. Simpan sekarang?")) {
				const res = await postDataKedua("tambah_proporsi_saham", dataTambah);
				await message(res);
				this.setup();
			}
		}, 0);
	}
	
	async cairkanProfit(d) {
		if (d.profit < 50000) {
			await modalShow(gagal, `Profit yang dimiliki oleh ${d.nama} belum bisa dicairkan`);
			return;
		}
		const nilai = await modalShow("Jumlah", "Masukkan jumlah yang akan ditarik...", true);
		if (!nilai) return;
		const nilaiTarik = safeFloat(nilai);
		const data = {
			nilai: nilaiTarik,
			data: d
		}
		setTimeout(async () => {
			if (await modalShow(confirm, `Anda akan menarik profit milik ${d.nama} senilai ${formatMataUang(nilaiTarik)}. Lanjutkan?`)) {
				const res = await postDataKedua("tarik_profit", data);
				await message(res);
				this.setup();
			}
		}, 0);
	}
	
	async hapusSaham(data) {
		if (await modalShow(confirm, `Hapus saham ${data.nama} sekarang?`)) {
			const res = await postDataKedua("hapus_saham", { id: data.id_investor });
			await message(res);
			this.setup();
		}
	}
	
	async tampilkanSaham() {
	    this.atas.innerHTML = "";
	    const dt = await getData("data_saham");
	    const data = dt.sort((a, b) => b.saldo - a.saldo);
	
	    const totalSaldo = data.reduce((sum, b) => sum + (b.saldo ?? 0), 0);
	    const pra = pembuatField(this.atas, "Tabel saldo dan profit");
	    const prm = pembuatField(this.atas, "Persentase saham");
		const tabel = makeTable(`
	    	<tr>
	    		<th>Id investor</th>
	    		<th>Nama</th>
	    		<th>Saldo</th>
	    		<th>Profit</th>
	    		<th>Persentase saham</th>
	    	</tr>
	    `);
	    pra.appendChild(tabel);
	    const names = [], values = [];
	    for (const item of data) {
	    	const n = item.nama.split(" ");
	    	names.push(n[0]);
	    	const saldo = item.saldo ?? 0;
	    	const persen = totalSaldo ? (saldo / totalSaldo) * 100 : 0;
	    	values.push(persen);
	    
	        const tr = document.createElement("tr");
	        tr.innerHTML = `
	        	<td>${item.id_investor}</td>
	        	<td>${item.nama}</td>
	        	<td>${formatMataUang(item.saldo)}</td>
	        	<td>${formatMataUang(item.profit)}</td>
	        	<td>${persen.toFixed(2)}%</td>
	        `;
	        tr.onclick = (e) => {
	        	const p = makeFlyParent(e);
	        	pembuatButtonGambar(p, [
	        		["btns", "Tambah proporsi saham", () => this.tambahProporsiSaham(item), "Pictures/add.png"],
	        		["btns", "Cairkan profit", () => this.cairkanProfit(item), "Pictures/banknotes.png"],
	        		["btns", "Hapus saham", () => this.hapusSaham(item), "Pictures/hapus.png"]
	        	]);
	        	
	        }
	        tabel.appendChild(tr);
	    }
	    grafikMaker(
	    	prm,
	    	"Grafik Persentase Kepemilikan Saham",
	    	"Berdasarkan acuan saldo per total saldo keseluruhan",
	    	names,
	    	"Nilai saham",
	    	values
	    );
	}
	
	async riwayat(tabel) {
		this.atas.innerHTML = "";
		const data = await getData(tabel);
		if (!data.length) {
			const label = makeLabel(`${tabel.replaceAll("_"," ")} tidak tersedia`, "biasa", this.atas);
			label.style.color = "red";
			return;
		}
		const prt = makeParent("frame", this.atas);
		for (const item of data) {
			const prt2 = makeParent("container", prt);
			prt2.style.display = "grid";
			prt2.style.gridTemplateColumns = "repeat(3,1fr)";
			for (const [key, value] of Object.entries(item)) {
				if (!["created_at", "id"].includes(key.toLowerCase())) {
					let val = [
						"profit_lama", "profit_baru",
						"saldo_lama", "saldo_baru"
					].includes(key.toLowerCase()) ? formatMataUang(value) : String(value);
					makeLabel(key, "biasa", prt2);
					makeLabel(":", "biasa", prt2);
					makeLabel(val, "biasa", prt2);
				}
			}
		}
	}
	
	setup() {
		resetJudul("PENGELOLAAN SAHAM");
		const tengah = document.getElementById("tengah");
		tengah.innerHTML = "";
		const prtButton = makeParent("container-horizontal", tengah);
		this.atas = makeParent("container", tengah);
		this.btnTambah = newmakeButton(prtButton, "btn", "Terbitkan saham baru", null, () => this.terbitkanSaham());
		pembuatButton(prtButton, [
			["btn", "Riwayat saldo", () => this.riwayat("riwayat_saldo")],
			["btn", "Riwayat profit", () => this.riwayat("riwayat_profit")]
		]);
		this.tampilkanSaham(); 
	}
}

class Keuangan {
	safeSave(obj, tipe) {
		let f = {}
		for (const [key, value] of Object.entries(obj)) {
			f[key] = tipe === "float" ? safeFloat(value) : safeInt(value);
		}
		return f;
	}
	
	siapkanFrames() {
		const atas = makeParent("container-horizontal", this.tengah);
		this.bawah = makeParent("container", this.tengah);
		pembuatButtonGambar(atas, [
			["btns", "Keuangan", () => this.keuangan(), "Pictures/budget.png"],
			["btns", "Staf", () => this.staff(), "Pictures/employees.png"],
			["btns", "Catatan gaji", () => this.catatanGaji(), "Pictures/laporan_keuangan.png"]

	dataLengkap(data) {
		const parent = pembuatJendela();
		const f = pembuatField(parent, `Detail info ${data.nama}`);
		const info_potongan = JSON.parse(data.info_potongan);

		const prt = makeParent("container", f);
		prt.style.display = "grid";
		prt.style.gridTemplateColumns = "repeat(3,1fr)";
		
		for (const item of [info_potongan, info_tunjangan, info_rekening]) {
			for (const [key, value] of Object.entries(item)) {
				let val = key.toLowerCase() === "nomor rekening" ? String(value) : formatMataUang(value);
				makeLabel(key, "biasa", prt);

				makeLabel(val, "biasa", prt);

	editKaryawan(data, p) {
		p.innerHTML = "";
		let newInp = {};
		const parent = makeParent("frame", p);
		const p1 = makeParent("container", parent);
		const p2 = makeParent("container", parent);
		const p3 = makeParent("container", parent);
		const p4 = makeParent("container", parent);
		const p5 = makeParent("container", parent);
		console.log(data);
		for (const [key, value] of Object.entries(data)) {
			if (!["id", "created_at", "inisial_code", "nama", "tanggal_mulai"].includes(key.toLowerCase())) {
				if (!["info_pembayaran", "info_potongan", "info_rekening", "info_tunjangan"].includes(key.toLowerCase())) {
					makeLabel(capitalize(key.replaceAll("_"," ")), "teks", p1);
					const inp = makeEntry(`Masukkan ${key.replaceAll("_"," ")} baru...`, "text", p1);
					inp.value = value;
					newInp[key] = inp;
				} else {
					let prt = p2;
					if (key.toLowerCase() === "info_pembayaran") { prt = p4; }
					else if (key.toLowerCase() === "info_potongan") { prt = p3; }
					else if (key.toLowerCase() === "info_rekening") { prt = p5; }
					
					const val = JSON.parse(value);
					for (const [k, v] of Object.entries(val)) {
						let tipe = "number";
						if (["nama bank", "nama pemilik rekening"].includes(k.toLowerCase())) { tipe = "text"; }
						else if (k.toLowerCase() === "pembayaran_terakhir") { tipe = "date"; }
						
						makeLabel(capitalize(k.replaceAll("_"," ")), "teks", prt);
						const inp = makeEntry(`Masukkan ${k.replaceAll("_"," ")} baru...`, tipe, prt);
						inp.value = v;
						newInp[k] = inp;
					}
				}
			}
		}
		const btnSimpan = makeButton("btn", "Simpan", null, null, p5);
		btnSimpan.onclick = () => {
			const hasil = pecahObject(newInp);
			console.log(hasil);

class TinjauGajiKaryawan {
	constructor(data) {
		this.data = data;
	}
	
	tinjau(item, data, aspek) {
		const hasil = pecahObject(data);
		const nilai = safeFloat(hasil.nilai);
		let info = aspek.toLowerCase() === "potongan" ? JSON.parse(item.info_potongan) : JSON.parse(item.info_tunjangan);
		info[hasil.aspek.toLowerCase()] = nilai;
		let key = aspek.toLowerCase() === "potongan" ? "info_potongan" : "info_tunjangan";
		item[key] = JSON.stringify(info);
		
		this.data = this.data.map(i =>
			i.inisial_code === item.inisial_code ? item : i
		);
		this.siapkanLayout(this.data);
	}
	
	async simpanDataGaji(data) {
		if (await modalShow(confirm, `Simpan data gaji milik ${data.nama} sekarang?`)) {
			const res = await postDataKedua("tambah_data_gaji", data);
			const result = await message(res);
			if (result) {
				this.data = this.data.filter(p => p.inisial_code !== data.inisial_code);
				this.siapkanLayout(this.data);
			}
		}
	}
	
	siapkanLayout(data) {
		this.tengah.innerHTML = "";
		for (const item of data) {
			const p = makeParent("frame", this.tengah);
			const name = makeLabel(item.nama.toUpperCase(), "jdl", p);
			name.style.alignSelf = "center";
			const kiri = makeParent("container", p);
			const kanan = makeParent("container", p);
			
			const tunjangan = JSON.parse(item.info_tunjangan);
			const potongan = JSON.parse(item.info_potongan);
			
			const labelGaji = makeLabel(`Gaji pokok: ${formatMataUang(item.gaji_pokok)}`, "teks", kiri);
			const info = pembuatField(kiri, "Info umum");
			const parentInfo = makeParent("container", info);
			parentInfo.style.display = "grid";
			parentInfo.style.gridTemplateColumns = "repeat(3,1fr)";
			
			let totalTunjangan = 0, totalPotongan = 0;
			
			for (const [key, value] of Object.entries(tunjangan)) {
				makeLabel(capitalize(key), "biasa", parentInfo);
				makeLabel(":", "biasa", parentInfo);
				makeLabel(formatMataUang(value), "biasa", parentInfo);
				totalTunjangan += value;
			}
			
			for (const [key, value] of Object.entries(potongan)) {
				makeLabel(capitalize(key), "biasa", parentInfo);
				makeLabel(":", "biasa", parentInfo);
				makeLabel(formatMataUang(value), "biasa", parentInfo);
				totalPotongan += value;
			}
			
			const gajiBersih = item.gaji_pokok + totalTunjangan - totalPotongan;
			const labelBersih = makeLabel(`Gaji bersih: ${formatMataUang(gajiBersih)}`, "teks", kiri);
			for (const i of [labelGaji, labelBersih]) {
				i.style.fontSize = "1.1rem";
				i.style.fontWeight = "600";
			}
			
			const aspek = pembuatCombo(kanan, "- Pilih satu -", ["Potongan", "Tunjangan"]);	
			const lanjutanTunjangan = pembuatEntry(kanan, [
				["aspek", "", "text"],
				["nilai", "", "number"]
			]);
			
			const parentButton = makeParent("container-horizontal", kanan);
			const btnSimpan = makeButton("btn", "Simpan", () => this.simpanDataGaji(item), null, parentButton);
			const btnTinjau = makeButton("btn btn-cancel", "Tinjau", () => this.tinjau(item, lanjutanTunjangan, aspek.value), null, parentButton);
			aspek.onchange = () => {
				const selectedAspect = aspek.value.toLowerCase();
				if (selectedAspect.toLowerCase() === "- pilih satu -") return;
				p.querySelectorAll("input").forEach(inp => {
					if (inp.type === "text") { inp.placeholder = `Masukkan nama ${selectedAspect}`; }
					else if (inp.type === "number") { inp.placeholder = `Masukkan nilai ${selectedAspect}`; }
				});
			}
			
		}
	}

	setup() {
		document.querySelectorAll(".dropdown-overlay").forEach(item => { item.style.display = "none"; });
		this.tengah = document.getElementById("tengah");
		this.siapkanLayout(this.data);
	}
}

async function cekGajian() {
	const dt = await fetch(url + "periksa_pembayaran_gaji", { method: "POST" });
	const dataGajian = await dt.json();
	
	if (!(kosong(dataGajian))) {
		const parent = makeParent("dropdown-overlay");
		parent.style.display = "flex";
		parent.style.flexDirection = "column";
		parent.style.right = "5px";
		parent.style.top = "5px";
		document.body.appendChild(parent);
		
		const lbl = makeLabel(`Terdapat ${dataGajian.length} staf telah jatuh tempo dalam pembayaran gaji. Mohon lakukan peninjauan`, "biasa", parent);
		const p = makeParent("container-horizontal", parent);
		const btnTinjau = makeButton("btn", "Tinjau", () => new TinjauGajiKaryawan(dataGajian).setup(), null, p);
		const btnBatal = makeButton("btn btn-cancel", "Batal", () => {
			parent.style.display = "none";
		}, null, p);
	}
	setTimeout(() => {
		document.querySelectorAll(".dropdown-overlay").forEach(item => {
			item.style.display = "none";
		});
	}, 10000);
}
