function pecahObject(data) {
	let hasil = {};
	for (const [key, value] of Object.entries(data)) {
		const val = value.value.trim();
		hasil[key] = val;
	}
	return hasil;
}

function kenaPajak(harga,status=0,persen=0){
	if (status === 1) {
		return Math.round(harga * (1 + persen / 100));
	} else { return safeFloat(harga); }
}

function mainkanBeep(frekuensi=2000, durasi=0.15) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = frekuensi;
    gain.gain.value = 0.2;
    osc.start();
    osc.stop(ctx.currentTime + durasi);
}

function aktifkanScanner(){

function cetak(id, ukuran="80mm auto", lebar="80mm") {
	const elemen = document.querySelector(id);
	const style = document.createElement("style");
	style.textContent = `
		@page {
			size: ${ukuran};
			margin: 0;
		}
	`;
	document.head.appendChild(style);
	
	elemen.classList.add("cetak");
	elemen.style.width = lebar;
	window.print();
	elemen.classList.remove("cetak");
	elemen.style.width = "";
	style.remove();
}

async function cetakStruk(data, includingQr=true){
	try {
		const keranjang = data.items || [];
		const map = {
			toko: toko,
			alamat: alamatToko,
			kontak: kontakToko,
			waktu: new Date().toLocaleString("id-ID"),
			no_trans: data.no_trans || "",
			operator: data.operator,
			total: formatMataUang(data.total || 0),
			bayar: formatMataUang(data.bayar || 0),
			kembali: formatMataUang(data.kembali || 0)
		}
		for (const [key, value] of Object.entries(map)) {
			document.getElementById(key).textContent = value;
		}
		const isi = document.getElementById("isi-keranjang");
		let for_isi = "";
		for (const item of keranjang) {
			for_isi += `${item.nama || ""} ${item.qty || 0}x = ${formatMataUang(item.subtotal_jual || 0)}<br>`;	
		}
		isi.innerHTML = for_isi;
		if (includingQr) {
			const elemenImg = document.getElementById("qr-struk");
			elemenImg.style.display = "block";
			const respon = await fetch(`${url}buat_qr_struk/${encodeURIComponent(data.no_trans || "")}`);
			if (!respon.ok) throw new Error("Gagal ambil QR");
			const blob = await respon.blob();
			if (elemenImg.dataset.url) URL.revokeObjectURL(elemenImg.dataset.url);
			const urlQr = URL.createObjectURL(blob);
			elemenImg.dataset.url = urlQr;
			elemenImg.src = urlQr;
			await elemenImg.decode();
		} else {
			document.getElementById("qr-struk").style.display = "none";
		}
		cetak("#struk");
		
	} catch (err) {
		await modalShow(error, err);
	}
}

function safeFloat(angka, fallback=0) {
	const n = parseFloat(angka);
	return Number.isNaN(n) ? fallback : n;
}
function safeInt(angka, fallback=0) {
	const n = parseInt(angka);
	return Number.isNaN(n) ? fallback : n;
}
async function ambil_tipe_file(judul) {
	try {
		showPopupLoading();
		const link = `${url}get_fl/${encodeURIComponent(judul)}`;
		const response = await fetch(link);
		const blob = await response.blob();
		hidePopupLoading();
		return URL.createObjectURL(blob);
	} catch {
		hidePopupLoading();
		return null;
	}
}
async function generateBarcode(parent, id, nama) {
	const data = {
		id: id,
		nama: nama
	}
	if (await modalShow(confirm, "Buat barcode baru untuk produk " + nama + "?")) {
		const res = await fetch(url + "generate_barcode", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify(data)
		});
		const gambar = await res.blob();
		const urlGambar = URL.createObjectURL(gambar);

		parent.innerHTML = "";
		const image = document.createElement("img");
		image.src = urlGambar;
		parent.appendChild(image);
		const a = document.createElement("a");
		a.href = urlGambar;
		a.download = nama + ".png";
		a.textContent = "Download gambar";
		parent.appendChild(a);
		const btnCetak = makeButton("btn", "Cetak", () => cetakBarcode(urlGambar));
		parent.appendChild(btnCetak);
	}
}

function grafikMaker(parent, jdl, subjdl, lbls, lbl, data) {
	const wadah = document.createElement("div");
	wadah.className = "container";
	const judul = document.createElement("h3");

	judul.textContent = jdl;
	const subjudul = document.createElement("p");

	const subparent = document.createElement("div");
	subparent.className = "chart-wrap";
	const canvas = document.createElement("canvas");
	subparent.appendChild(canvas);

	new Chart(canvas, {
			type: "bar",
			data: {
				labels: lbls,
				datasets: [{
						label: lbl,
						data: data,
						backgroundColor: primary,
						borderRadius: 2,
						maxBarThickness: 40
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: {
					legend: { display: false }
				},
				scales: {
					y: {
						beginAtZero: true,
						grid: { color: primarySoft }
					},
					x: {
						grid: { display: false }
					}
				}
			}
	})
	for (const item of [judul, subjudul, subparent]) {
		wadah.appendChild(item);
	}
	parent.appendChild(wadah);
}

function makeButton(kelas, teks, command, image=null, bg=null, fg=null, fw=null) {
	const btn = document.createElement("button");
	btn.className = kelas;
	
	if (bg && fg && fw) {
		btn.style.background = bg;
		btn.style.color = fg;
		btn.style.fontWeight = fw;
	}

	if (image) {
		btn.style.display = "flex";
		btn.style.alignItems = "center";
		btn.style.gap = "6px";
		const img = document.createElement("img");
		img.src = url + image;
		img.style.width = "25px";
		img.style.height = "25px";
		img.alt = "";
		btn.appendChild(img);
		btn.appendChild(document.createTextNode(teks));
	} else {
		btn.textContent = teks;
	}
	btn.onclick = function() {
		setTimeout(command, 300);
	}
	return btn;
}

function pembuatCombo(parent, def, data) {
	const select = document.createElement("select");
	select.className = "combo";

	const defaultTop = document.createElement("option");
	defaultTop.value = def;
	defaultTop.textContent = def;
	select.appendChild(defaultTop);

	for (const item of data) {
		const op = document.createElement("option");
		op.value = item;
		op.textContent = item;
		select.appendChild(op);
	}

	parent.appendChild(select);
	return select;
}

function pembuatTextArea(parent, obj){
	let area = {};
	for (const [key, placeholder, teks] of obj){
		const are = document.createElement("textarea");
		are.rows = 14;
		are.cols = 40;
		are.placeholder = placeholder;
		are.value = teks;
		are.className = "entry";
		are.style.background = "transparent";
		are.style.color = "white";
		area[key] = are;
		const label = makeLabel(capitalize(key.replace(/_/g, " ")), "teks");
		label.style.color = "white";
		parent.appendChild(label);
		parent.appendChild(are);
	}
	return area;
}

function pembuatEntry(parent, arrayObject) {
	let entries = {}
	for (const k of arrayObject) {
		const [key, value, tipe] = k;
		const lbl = makeLabel(key.replace(/_/g, " ").toUpperCase(), "input-title");
		const ent = document.createElement("input");
		ent.type = tipe;
		ent.placeholder = value;
		ent.className = "entry";
		entries[key] = ent
		parent.appendChild(lbl);
		parent.appendChild(ent);
	}
	return entries;
}

function pembuatFrame({
		displayFrame = "block",
		direction = "row",
		grid = "1fr",
		padding = "10px",
		margin = "10px",
		background = "transparent"
	} = {}) {
	let frame = document.createElement("div");
	frame.className = "value-frame";
	frame.style.display = displayFrame;
	frame.style.margin = margin;
	frame.style.padding = padding;
	frame.style.background = background;
	frame.style.width = "100%";
	frame.style.overflow = "auto";
	if (displayFrame === "flex") {
		frame.style.flexDirection = direction;
	} else if (displayFrame === "grid") {
		frame.style.gridTemplateColumns = grid;
	}

	return frame;
}

class UserMenu {
	constructor() {
		this.user = null;
		this.entries = null;
		this.tambahPengguna = this.tambahPengguna.bind(this);
		this.daftarPengguna = this.daftarPengguna.bind(this);
	}

	async daftarPengguna() {
		const hasil = Object.fromEntries(Object.entries(this.entries).map(([key, value]) => [key, value.value.trim()]));

		if (!this.user) {
			if (hasil["status"].toLowerCase() !== "owner") {
				await modalShow(gagal, "Pendaftaran pengguna pertama kali harus berstatus owner");
				return;
			}
		}
		if (![hasil.nama, hasil["status"], hasil.password, hasil.konfir].every(Boolean)) {
			await modalShow(gagal, "Nama, status, kata sandi, konfirmasi kata sandi wajib diisi");
			return;
		}
		if (hasil.password !== hasil.konfir) {
			await modalShow(gagal, "Kata sandi dan konfirmasi kata sandi harus sama");
			return;
		}
		const sama = this.user.find(p => p.nama.toLowerCase() === hasil.nama.toLowerCase) ?? null;
		if (sama) {
			await modalShow(gagal, "Pengguna atas nama " + hasil.nama + " telah terdaftar");
			return
		}

		const dataUnggah = {
			nama: hasil.nama,
			status: hasil["status"],
			password: hasil.password,
			question: hasil.question,
			answer: hasil.jawaban,
			operator: user,
			sumber: idDevice
		}
		const konfirmasi = await modalShow(confirm, "Data telah siap. Unggah sekarang?", false);
		if (!konfirmasi) {
			return;
		}
		const upload = await postDataKedua("tambah_user_baru", dataUnggah);
		await message(upload);
		resetPop();
		pengguna.setup();
	}

	async tambahPengguna() {
		this.user = await getData("users");
		const cont = pembuatJendela();

		const judul = makeButton("invisible-btn", "INPUT FORM PENGGUNA BARU", null, "Pictures/edit.png");
		const info_input = [
			["nama", "Masukkan nama", "text"],
			["status", "Masukkan status", "text"],
			["password", "Masukkan kata sandi", "password"],
			["konfir", "Masukkan konfirmasi password", "password"],
			["question", "Masukkan pertanyaan keamanan", "text"],
			["jawaban", "Masukkan jawaban", "text"]
		]
		cont.appendChild(judul);
		this.entries = pembuatEntry(cont, info_input);
		const simpan = makeButton("btn", "Daftar", () => this.daftarPengguna());
		cont.appendChild(simpan);
	}
}

	async simpanPwBaru(info, data){
		const pw = info["password baru"].value.trim();
		const kpw = info["konfirmasi password baru"].value.trim();
		if (!pw || !kpw) return;
		if (pw !== kpw){ await modalShow(gagal, "Password dan konfirmasi password harus sama"); return; }
		if (pw.length < 6){ await modalShow(gagal, "Password harus berisi minimal 6 karakter"); return; }
		
		const dataKirim = {
			nama: data.nama,
			id: data.inisial_code,
			pw: pw
		}
		
		if (await modalShow(confirm, `Data telah siap. Perbarui password ${data.nama} sekarang?`)) {
			const hasil = await postDataKedua("perbarui_password", dataKirim);
			message(hasil);

function pembuatField(parent, teks) {
	const field = document.createElement("fieldset");
	field.className = "field";
	const legend = document.createElement("legend");
	legend.style.fontSize = "1rem";
	legend.style.fontWeight = "600";
	legend.textContent = teks.toUpperCase();
	field.appendChild(legend);
	parent.appendChild(field);
	return field;
}

function makeLabel(teks, kelas) {
	const lbl = document.createElement("p");
	lbl.textContent = teks;
	lbl.className = kelas;
	return lbl;
}

function capitalize(teks=""){
	if(!teks)return teks;
	return teks[0].toUpperCase() + teks.slice(1).toLowerCase();
}

function resetOver(){document.querySelector(".dropdown-overlay").remove();}

function resetPop() {
	document.getElementById("kiri").classList.add("hidden");
	hideWindow();
}

function formatUnit(str, sat) {
	return str + " " + sat;
}

function formatMataUang(uang) {
	if (formatUang[1] === "kiri") {
		return formatUang[0] + uang.toString().replace(/\B(?=(\d{3})+(?!\d))/g, formatUang[2]);
	} else {
		return uang.toString().replace(/\B(?=(\d{3})+(?!\d))/g, formatUang[2]) + formatUang[0];
	}
}

async function uploadFile(endpoint, file) {
	showPopupLoading();
	try {
		const res = await fetch(url + endpoint, {
				method: "POST",
				body: file
		});
		const r = await res.json()
		hidePopupLoading();
		return r;
	} catch (e) {
		hidePopupLoading();
		await modalShow(error, e);
		return null;
	}
}

async function postData(endpoint, data) {
	showPopupLoading();
	try {
		const res = await fetch(url + endpoint, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify(data),
				credentials: "include"
		});
		const d = await res.json();
		hidePopupLoading();
		return d;
	} catch (error) {
		hidePopupLoading();
		mainkanBeep(300,0.3);
		await modalShow(gagal, "Gagal upload data ke server");
		return null;
	};
}

async function postDataKedua(endpoint, data) {
	showPopupLoading();
	try {
		const res = await fetch(url + "post_data/" + endpoint, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify(data),
				credentials: "include"
		});
		const d = await res.json();
		hidePopupLoading();
		return d;
	} catch (error) {
		hidePopupLoading();
		mainkanBeep(300,0.3);
		await modalShow(gagal, "Gagal upload data ke server");
		return null;
	};
}

async function takePictures(file="", folder="", age=86400) {
	try {
		const info = {
			file: file,
			folder: folder,
			age: age
		}
		const payload = JSON.stringify(info);
		const link = `get_all_pictures/${encodeURIComponent(payload)}`;
		const res = await fetch(url + link);
		if (!res.ok) throw new Error(`Status ${res.status}`);
		const blob = await res.blob();
		return URL.createObjectURL(blob);
	} catch (er) {
		await modalShow(error, er);
		return null;
	}
}

async function getDt(endpoint) {
	try {
		const response = await fetch(url + endpoint, {
			method: "GET",
			credentials: "include"
		});
		const data = await response.json();
		return data;
	} catch (e) {
		await modalShow(error, e);
		return null
	}
}

async function getData(endpoint, cache=false) {
	showPopupLoading(`Menyiapkan data ${endpoint.replace(/_/g, " ")}...`);
	try {
		const URL = `lihat_data?tabel=${encodeURIComponent(endpoint)}`;
		const res = await fetch(url + URL, {
			method: "GET",
			headers: {
				"Accept": "application/json"
			},
			credentials: "include"
		});
		if (res.status === 401) {
			hidePopupLoading();
			return [];
		}
		const data = await res.json();
		if (cache) localStorage.setItem(endpoint, JSON.stringify(data));
		hidePopupLoading();
		return data;
	} catch {
		hidePopupLoading();
		await modalShow(gagal, "Koneksi server tidak aktif. Data memakai cadangan data", false);
		const data = localStorage.getItem(endpoint);
		return data ? JSON.parse(data) : [];
	}
}

function addPajak(harga, status = 0, persen = 0) {
	let result = harga;
	if (status === 1) {
		result = Math.round(harga * (1 + persen / 100));
	}
	return result;
}

function hitungPotonganTingkat(harga, min, hargaTingkat, status = 0, persen = 0) {
	let result = harga * min - hargaTingkat;
	if (status === 1) {
		result = result * (1 + persen / 100);
	}
	return result;
}

		}
		return originalAppend(child);
	};

	return table;

let _modalResolve = null;

function modalShow(title, message, showInput = false) {
    if (_modalResolve) {
        const prev = _modalResolve;
        _modalResolve = null;
        prev(null);
    }

    return new Promise((resolve) => {
        _modalResolve = resolve;

        const modal     = document.getElementById("customModal");
        const elTitle   = document.getElementById("modalTitle");
        const elMessage = document.getElementById("modalMessage");
        const input     = document.getElementById("modalInput");
        const btnOK     = document.getElementById("modalBtnOK");
        const btnCancel = document.getElementById("modalBtnCancel");

        elTitle.textContent   = title;
        elMessage.textContent = message;

        input.value = "";
        input.classList.toggle("hidden", !showInput);

        btnOK.onclick     = null;
        btnCancel.onclick = null;
        input.onkeydown   = null;
        input.onkeyup     = null;

        modal.classList.remove("hidden");

        if (showInput) {
            setTimeout(() => input.focus(), 0);
        } else {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }
        }

        const selesai = (value) => {
            if (_modalResolve !== resolve) return;
            _modalResolve = null;

            modal.classList.add("hidden");

            btnOK.onclick     = null;
            btnCancel.onclick = null;
            input.onkeydown   = null;
            input.onkeyup     = null;

            input.blur();
            input.value = "";

            resolve(value);
        };

        btnOK.onclick = () => {
            if (showInput) {
                const val = input.value ?? "";
                selesai(val);
            } else {
                selesai(true);
            }
        };

        btnCancel.onclick = () => selesai(null);

        if (showInput) {
            input.onkeydown = (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    btnOK.click();
                }
                if (e.key === "Escape") {
                    e.preventDefault();
                    btnCancel.click();
                }
            };
        } else {
            const escHandler = (e) => {
                if (e.key === "Escape") {
                    e.preventDefault();
                    document.removeEventListener("keydown", escHandler, true);
                    btnCancel.click();
                }
            };
            document.addEventListener("keydown", escHandler, true);
        }
    });
}

class Dashboard {
	constructor() {

		this.token = 0;

		this.a = {};

	angka(v) { return Number(v) || 0; }
	rupiah(v) { return formatMataUang(Math.round(this.angka(v))); }
	labelPeriode() { return this.periode.replace(/_/g, " "); }

	isiGrid(field, daftar) {

	// ---------- persiapan ----------
	siapkanHalaman() {
		resetPop();
		this.tengah = document.getElementById("tgh");
		this.tengah.innerHTML = "";
		this.induk = makeParent("frame");
		this.induk.style.background = "white";

		this.tengah.appendChild(this.induk);

		this.frameOpr = makeParent("container");
		this.frameKtgr = makeParent("container");
		this.lastTrx = makeParent("container");

		for (const item of [bar, this.induk, this.frameOpr, this.frameKtgr, this.lastTrx, this.last]) { this.tengah.appendChild(item); }
		pembuatButton(bar, [

	}

	async muatData() {
		const filter = encodeURIComponent(JSON.stringify({opr: "semua operator", prd: this.labelPeriode()}));
		const [jual, uang, produk, transaksi, kewajiban, pengeluaran, cadangan, pesanan, daftar] = await Promise.all([
			getDt(`get_data_sold_out_today/${this.periode}`),
			getDt("get_keuangan"),
			getData("produk"),
			getDt("filter_riwayat_penjualan/" + filter),
			getData("kewajiban"),
			getData("Pengeluaran"),
			getData("cadangan_keranjang"),
			getData("permintaan"),
			getDt("permintaan_pendaftaran_user")
		]);
		this.d = {
			jual, uang, cadangan, pesanan, daftar,
			produk: produk ?? [],
			transaksi: transaksi ?? [],
			kewajiban: kewajiban ?? [],
			pengeluaran: pengeluaran ?? []
		};
	}

	analisis() {
		const kategoriById = Object.fromEntries(this.d.produk.map(p => [p.id_produk, p.kategori || "Tanpa kategori"]));
		const opr = {};
		const kat = {};
		const info = {pajak: 0, diskon: 0, tingkat: 0, hpp: 0};

		for (const t of this.d.transaksi) {
			const nama = t.operator || "-";
			opr[nama] ??= {nama: nama, transaksi: 0, total: 0, laba: 0};
			opr[nama].transaksi += 1;
			opr[nama].total += this.angka(t.total);
			opr[nama].laba += this.angka(t.total_laba);
			info.pajak += this.angka(t.kena_pajak);

			let belanja = [];
			try { belanja = JSON.parse(t.data_belanja); } catch { belanja = []; }
			for (const i of belanja) {
				info.diskon += this.angka(i.potongan_diskon);
				info.tingkat += this.angka(i.potongan_tingkat);
				info.hpp += this.angka(i.subtotal_modal);
				const k = kategoriById[i.id] || "Tanpa kategori";
				kat[k] ??= {nama: k, terjual: 0, total: 0, laba: 0};
				kat[k].terjual += this.angka(i.qty_asli);
				kat[k].total += this.angka(i.subtotal_jual);
				kat[k].laba += this.angka(i.laba);
			}
		}
		this.a = {info, operator: Object.values(opr), kategori: Object.values(kat)};
	}

	// ---------- bagian tampilan ----------
	tampilkanPenjualan() {
		const j = this.d.jual;
		if (!j) return;
		const total = this.angka(j.total);
		const laba = this.angka(j.laba);
		const jumlah = this.angka(j.jumlah);
		const margin = total > 0 ? (laba / total * 100).toFixed(1) : "0";
		const rata = jumlah > 0 ? total / jumlah : 0;
		const i = this.a.info;

		const field = pembuatField(this.induk, `Penjualan ${this.labelPeriode()}`);
		this.isiGrid(field, [
			["Pemasukan", this.rupiah(total)],
			["Keuntungan", this.rupiah(laba)],
			["Margin keuntungan", margin + "%"],
			["Jumlah transaksi", formatUnit(jumlah, "kali")],
			["Rata-rata per transaksi", this.rupiah(rata)],
			["Produk terjual", formatUnit(j.terjual, "unit")],
			["Harga pokok penjualan", this.rupiah(i.hpp)],
			["Potongan diskon", this.rupiah(i.diskon)],
			["Potongan tingkat", this.rupiah(i.tingkat)],
			["Kena pajak", this.rupiah(i.pajak)]
		]);
	}

	tampilkanKeuangan() {
		const u = this.d.uang;
		if (!u) return;
		const kas = this.angka(u.kas);
		const persediaan = this.angka(u.persediaan);
		const asetLain = this.angka(u.aset_lain);
		const modal = this.angka(u.modal);
		const pendapatan = this.angka(u.pendapatan);
		const hpp = this.angka(u.hpp);
		const beban = this.angka(u.beban);
		const pengambilan = this.angka(u.pengambilan);
		const kewajiban = this.d.kewajiban.reduce((s, b) => s + this.angka(b.nilai), 0);
		const labaBersih = pendapatan - hpp - beban;
		const ekuitas = modal + labaBersih - pengambilan;

		const field = pembuatField(this.induk, "Kondisi keuangan");
		this.isiGrid(field, [
			["Saldo kas", this.rupiah(kas)],
			["Nilai persediaan", this.rupiah(persediaan)],
			["Nilai aset lain", this.rupiah(asetLain)],
			["Total aset", this.rupiah(kas + persediaan + asetLain)],
			["Total kewajiban", this.rupiah(kewajiban)],
			["Ekuitas", this.rupiah(ekuitas)],
			["Pendapatan usaha", this.rupiah(pendapatan)],
			["Beban", this.rupiah(beban)],
			["Laba bersih", this.rupiah(labaBersih)],
			["Pengambilan pemilik", this.rupiah(pengambilan)]
		]);
	}

	tampilkanPeringatan() {
		const hariIni = new Date();
		hariIni.setHours(0, 0, 0, 0);
		const habis = [];
		const menipis = [];
		const kadaluarsa = [];

		for (const p of this.d.produk) {
			const stok = this.angka(p.jumlah);
			const min = this.angka(p.stok_minimum);
			if (stok <= 0) {
				habis.push(p);
			} else if (stok <= min) {
				menipis.push(p);
			}
			if (stok > 0 && p.kadaluarsa) {
				const tgl = new Date(p.kadaluarsa);
				if (!isNaN(tgl)) {
					const sisa = Math.floor((tgl - hariIni) / 86400000);
					if (sisa <= 30) kadaluarsa.push({p: p, sisa: sisa});
				}
			}
		}
		kadaluarsa.sort((a, b) => a.sisa - b.sisa);
		menipis.sort((a, b) => a.jumlah - b.jumlah);

		const field = pembuatField(this.induk, "Peringatan stok");
		this.isiGrid(field, [
			["Total jenis produk", formatUnit(this.d.produk.length, "produk")],
			["Stok habis", formatUnit(habis.length, "produk")],
			["Stok menipis", formatUnit(menipis.length, "produk")],
			["Kadaluarsa ≤ 30 hari", formatUnit(kadaluarsa.length, "produk")]
		]);

		if (habis.length) {
			this.tabelDari(field, ["Stok habis", "Kategori"], habis.map(p => [p.nama, p.kategori ?? "-"]));
		}
		if (menipis.length) {
			this.tabelDari(field, ["Stok menipis", "Stok", "Minimum"],
				menipis.map(p => [p.nama, `${p.jumlah} ${p.satuan_jual ?? ""}`, p.stok_minimum]));
		}
		if (kadaluarsa.length) {
			this.tabelDari(field, ["Hampir kadaluarsa", "Tanggal", "Sisa"],
				kadaluarsa.map(({p, sisa}) => [
					p.nama,
					p.kadaluarsa,
					sisa < 0 ? `Lewat ${-sisa} hari` : `${sisa} hari lagi`
				]));
		}
	}

	tampilkanOperasional() {
		const cadangan = Array.isArray(this.d.cadangan) ? this.d.cadangan.length : 0;
		const pesanan = Array.isArray(this.d.pesanan)
			? this.d.pesanan.filter(p => String(p.jenis).toLowerCase() === "pesanan pembeli").length : 0;
		const daftar = Array.isArray(this.d.daftar) ? this.d.daftar.length : 0;

		const field = pembuatField(this.induk, "Operasional");
		this.isiGrid(field, [
			["Cadangan transaksi", formatUnit(cadangan, "transaksi")],
			["Pesanan pembeli", formatUnit(pesanan, "pesanan")],
			["Permintaan daftar user", formatUnit(daftar, "permintaan")]
		]);
	}

	tampilkanOperator() {
		const data = [...this.a.operator].sort((a, b) => b.total - a.total);
		if (!data.length) return;
		const field = pembuatField(this.frameOpr, `Kinerja operator ${this.labelPeriode()}`);
		this.tabelDari(field, ["Operator", "Transaksi", "Total", "Laba"],
			data.map(o => [o.nama, o.transaksi, this.rupiah(o.total), this.rupiah(o.laba)]));
		grafikMaker(this.frameOpr, "OPERATOR", "Total penjualan per operator",
			data.map(o => o.nama), "Total penjualan", data.map(o => Math.round(o.total)));
	}

	tampilkanKategori() {
		const data = [...this.a.kategori].sort((a, b) => b.total - a.total);
		if (!data.length) return;
		const field = pembuatField(this.frameKtgr, `Penjualan per kategori ${this.labelPeriode()}`);
		this.tabelDari(field, ["Kategori", "Terjual", "Total", "Laba"],
			data.map(k => [k.nama, formatUnit(k.terjual, "unit"), this.rupiah(k.total), this.rupiah(k.laba)]));
		grafikMaker(this.frameKtgr, "KATEGORI", "Kontribusi omset per kategori",
			data.map(k => k.nama), "Total pemasukan", data.map(k => Math.round(k.total)));
	}

	tampilkanProdukTerlaris() {
		const dt = this.d.jual?.data ?? [];
		if (!dt.length) return;
		const urut = [...dt].sort((a, b) => b.terjual - a.terjual);
		const top = urut.slice(0, 5);
		grafikMaker(this.lastTrx, "PRODUK TERLARIS", `5 produk terjual terbanyak ${this.labelPeriode()}`,
			top.map(p => p.nama), "Terjual", top.map(p => p.terjual));

		const field = pembuatField(this.last, "Semua produk terjual");
		this.tabelDari(field, ["No", "Nama produk", "Terjual", "Total", "Laba"],
			urut.map((p, i) => [i + 1, p.nama, formatUnit(p.terjual, "unit"), this.rupiah(p.total), this.rupiah(p.laba)]));
	}

	tampilkanTransaksiTerakhir() {
		const data = [...this.d.transaksi].sort((a, b) => this.angka(b.id) - this.angka(a.id)).slice(0, 5);
		if (!data.length) return;
		const field = pembuatField(this.last, "Transaksi terakhir");
		this.tabelDari(field, ["Waktu", "Operator", "Total"],
			data.map(t => [t.waktu, t.operator, this.rupiah(t.total)]));
	}

	tampilkanPengeluaran() {
		const map = {};
		let total = 0;
		for (const p of this.d.pengeluaran) {
			const k = p.kategori || "Lainnya";
			map[k] = (map[k] || 0) + this.angka(p.total);
			total += this.angka(p.total);
		}
		const data = Object.entries(map).sort((a, b) => b[1] - a[1]);
		if (!data.length) return;
		const field = pembuatField(this.last, "Pengeluaran tercatat");
		this.isiGrid(field, [
			["Total pengeluaran", this.rupiah(total)],
			["Jumlah catatan", formatUnit(this.d.pengeluaran.length, "catatan")]
		]);
		this.tabelDari(field, ["Kategori", "Total"], data.map(([k, v]) => [k, this.rupiah(v)]));
		grafikMaker(this.tengah, "PENGELUARAN", "Total pengeluaran per kategori",
			data.map(([k]) => k), "Pengeluaran", data.map(([, v]) => Math.round(v)));
	}

	// ---------- alur utama ----------
	async setup(periode = "hari_ini") {
		const id = ++this.token;
		this.periode = periode;
		this.siapkanHalaman();
		await this.muatData();
		if (id !== this.token) return; // user sudah pindah periode/halaman
		this.analisis();
		this.tampilkanPenjualan();
		this.tampilkanKeuangan();
		this.tampilkanPeringatan();
		this.tampilkanOperasional();
		this.tampilkanOperator();
		this.tampilkanKategori();
		this.tampilkanProdukTerlaris();
		this.tampilkanTransaksiTerakhir();
		this.tampilkanPengeluaran();
	}
}

	}
	async simpanPengeluaranBaru(ent) {

class Pajak {
	constructor() {

		this.riwayatPajak = null;
	}

	hitung() {
		this.totalPajak = this.riwayatPajak.reduce((sum, b) => sum + b.pajak, 0);
		this.persen = 0;
		this.aktif = 0;
		if (this.pajak) {
			const pjk = this.pajak[0];
			this.persen = pjk.persen;
			this.aktif = pjk.aktif;
		}
		this.rp = [];
		for (const item of this.riwayatPajak) {
			const ada = this.rp.find(p => p.nama.toLowerCase() === item.nama.toLowerCase()) ?? null;
			if (ada) {

class Produk {
	constructor() {
		this.produk = null;
		this.tingkat_a = null;
		this.tingkat_b = null;
		this.produkPerKategori = null;
		this.filterProduk = [];
		this.video = document.getElementById("preview");
		this.status = document.getElementById("status");
	}
	
	async bukaScanner(target, dispatch=false) {
		await aktifkanScanner();
		this.mulaiScan(target, dispatch);	
	}
	
	async mulaiScan(target=null, dispatch=false) {
		if (!("BarcodeDetector" in window)){await modalShow(gagal, "Browser ini tidak mendukung barcode");return;}
		try {
			const stream = await navigator.mediaDevices.getUserMedia({
				video: { facingMode: "environment" }
			});
			this.video.srcObject = stream;
			await new Promise(resolve => {
				this.video.onloadedmetadata = resolve;
			});
			this.status.textContent = "Mulai scan...";
		} catch (err) {
			await modalShow(error, err);
			return;
		}
		
		const detector = new BarcodeDetector({
			formats: ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"]
		});
		
		let hasilTerakhir = null;
		let waktuTerakhir = 0;
		
		const loop = async () => {
			if (!scanning) return;
			try {
				const barcodes = await detector.detect(this.video);
				if (barcodes.length > 0) {
					const hasil = barcodes[0].rawValue;
					const sekarang = Date.now();
					const sudahlewat = sekarang - waktuTerakhir > 2000;
					if (sudahlewat || hasil !== hasilTerakhir) {
						hasilTerakhir = hasil;
						waktuTerakhir = sekarang;
						if (target) {
							target.value = hasil;
							if (dispatch) {
								target.dispatchEvent(new KeyboardEvent("keydown", {
									key: "Enter",
								    code: "Enter",
								    bubbles: true,
							        cancelable: true
								}));
								return; }
							const prd = await getData("produk");
							if (prd.find(p => p.barcode === hasil) ?? null) {
								await modalShow(gagal, "Produk dengan barcode ini sudah ada");
								tutupScanner();
								return;
							}
							mainkanBeep();
							tutupScanner();
						}
					}
				}
			} catch (err) {
				await modalShow(error, err);
			}
			this.animationId = requestAnimationFrame(loop);
		}
		loop();
	}
	
	hitungJumlahDanModal(parent, harga, jumlah, isi) {
		const h = safeFloat(harga.value.trim());
		const j = safeInt(jumlah.value.trim());
		const i = safeInt(isi.value.trim());
		
		const sj = j * i;
		const hm = h / i;
		
		parent.innerHTML = "";
		for (const i of [
			makeButton("btns", `Jumlah seluruh produk: ${sj} unit`, null),
			makeButton("btns", `Harga modal peritem: ${formatMataUang(hm)}`, null)
		]) parent.appendChild(i);
	}

		this.info1["barcode"] = inputBarcode;

				["poin", "Masukkan poin penjualan", "number"],
				["stok_minimum", "Masukkan stok minimum", "number"]
		])
		this.info2.isi_satuan.oninput = () => this.hitungJumlahDanModal(pr0, this.info1.harga_beli, this.info1.jumlah_beli, this.info2.isi_satuan);
		
		const pr3 = makeParent("container");
		this.info3 = pembuatEntry(pr3, [
				["kategori", "Masukkan kategori", "text"],
				["satuan_beli", "Masukkan satuan beli", "text"],
				["satuan_jual", "Masukkan satuan jual", "text"],
				["supplier", "Masukkan supplier", "text"]
		])

		const pr4 = makeParent("container");
		this.newKategori = pembuatCombo(pr4, "Pilih kategori baru", [...new Set(this.produk.map(p => p.kategori))]);
		this.newSatuanBeli = pembuatCombo(pr4, "Pilih satuan beli baru", [...new Set(this.produk.map(p => p.satuan_beli))]);
		this.newSatuanJual = pembuatCombo(pr4, "Pilih satuan jual baru", [...new Set(this.produk.map(p => p.satuan_jual))]);
		this.newSupplier = pembuatCombo(pr4, "Pilih supplier baru", [...new Set(this.produk.map(p => p.supplier))]);

		this.catatan.className = "entry";

		this.exp.className = "entry";
		this.exp.value = new Date().toISOString().split('T')[0];
		parent.appendChild(this.exp);
		parent.appendChild(this.catatan);

	async simpanProdukBaru() {
		const r1 = Object.fromEntries(
			Object.entries(this.info1).map(([key, val]) => [key, val.value.trim()])
		);
		const r2 = Object.fromEntries(
			Object.entries(this.info2).map(([key, val]) => [key, val.value.trim()])
		);
		const r3 = Object.fromEntries(
			Object.entries(this.info3).map(([key, val]) => [key, val.value.trim()])
		);
		const ktgr = this.newKategori.value;
		const sb = this.newSatuanBeli.value;
		const sj = this.newSatuanJual.value;
		const sup = this.newSupplier.value;

		const kategori = ktgr.toLowerCase() !== "pilih kategori baru" ? ktgr : r3.kategori;
		const satuanBeli = sb.toLowerCase() !== "pilih satuan beli baru" ? sb : r3.satuan_beli;
		const satuanJual = sj.toLowerCase() !== "pilih satuan jual baru" ? sj : r3.satuan_jual;
		const supplier = sup.toLowerCase() !== "pilih supplier baru" ? sup : r3.supplier;
		const waktu = this.exp.value.trim();

		if (![
				r1.nama,
				r1.jumlah_beli,
				r1.harga_beli,
				r2.harga_jual,
				r2.isi_satuan
			].every(Boolean)) {
			await modalShow(gagal, "Nama, jumlah, harga beli, harga jual, dan isi satuan harus diisi");
			return;
		}

		try {
			const hargaBeli = safeFloat(r1.harga_beli);
			const jumlah = safeInt(r1.jumlah_beli) * safeInt(r2.isi_satuan);
			const hargaJual = safeFloat(r2.harga_jual);
			const isiSatuan = safeInt(r2.isi_satuan);
			const poin = safeInt(r2.poin);
			const stokMinimum = safeInt(r2.stok_minimum);
			const hargaModal = Math.round(hargaBeli / isiSatuan);

			const data = {
				nama: r1.nama,
				barcode: r1.barcode,
				kategori: kategori,
				catatan: this.catatan.value.trim(),
				kadaluarsa: waktu,
				satuan_beli: satuanBeli,
				satuan_jual: satuanJual,
				isi_satuan: isiSatuan,
				supplier: supplier,
				harga_beli: hargaBeli,
				harga_modal: hargaModal,
				harga_jual: hargaJual,
				jumlah: jumlah,
				stok_minimum: stokMinimum,
				poin: poin,
				operator: user,
				sumber: idDevice
			}

			if (await modalShow(confirm, "Data telah siap. Unggah sekarang?")) {
				const upload = await postDataKedua("tambah_produk_baru", data);
				if (upload) {
					if (upload.stat.toLowerCase() === "berhasil") {
						const fotoKatalog = this.pilihGambar.files[0];
						if (fotoKatalog) {
							const formData = new FormData();
							formData.append("file", fotoKatalog, r1.nama + ".jpeg");
							showPopupLoading("Menambahkan foto katalog...");
							const uploadGambar = await fetch(url + "post_file/upload_foto_katalog", {
									method: "POST",
									body: formData
							});
							const res = await uploadGambar.json();
							if (res.stat.toLowerCase() === "berhasil") {
								hidePopupLoading();
								await modalShow(berhasil, res.pesan);
								this.tambahProdukBaru();
							} else {
								hidePopupLoading();
								await modalShow(gagal, "Data berhasil disimpan. Foto katalog gagal disimpan")
								this.tambahProdukBaru();
							}
						} else {
							await modalShow(upload.stat, upload.pesan + ". Katalog produk tidak disertakan");
							this.tambahProdukBaru();
						}
					} else {
						await modalShow(upload.stat, upload.pesan);
					}
				} else {
					await modalShow(gagal, pesanGagal);
				}
			}
		} catch (er) {
			await modalShow(error, er);
		}
	}

	hitungHargaModal() {
		const hargaBeli = safeFloat(this.info1.harga_beli.value.trim());
		const isi = safeInt(this.info2.isi_satuan.value.trim());
		const hargaModal = Math.round(hargaBeli / isi);
		this.infoLabel.textContent = "Harga modal produk: " + formatMataUang(hargaModal);
	}

	async showPicture(nama, id) {
		const wadah = pembuatJendela();
		const field = pembuatField(wadah, nama);
		let gambar = null;
		const req = await getDt(`dapatkan_gambar/${nama}`);
		if (req.original){
			gambar = req.original;
		} else {
			gambar = await takePictures(nama + "_thumb.jpeg", "folder_katalog");
		}
		const pict = document.createElement("img");
		pict.src = gambar;
		pict.className = "image";
		pict.loading = "lazy";
		
		const prt = makeParent("container-horizontal");
		const barcode = await takePictures(nama + ".png", "folder_foto");
		const imgBar = document.createElement("img");
		imgBar.className = "image";
		imgBar.src = barcode;
		imgBar.loading = "lazy";
		for (const item of [pict, imgBar]) {
			item.style.width = "150px";
			item.style.height = "150px";
			prt.appendChild(item);
		}

		cont.style.gridTemplateColumns = "repeat(2, 1fr)";

				["btns", "Tambah foto baru", () => this.gantiFotoKatalog(field, id), "Pictures/kelola_gambar.png"],
				["btns", "Buat barcode", () => generateBarcode(wadah, id, nama), "Pictures/barcode.png"],
				["btns", "Cetak gambar katalog", () => cetakBarcode(gambar), "Pictures/cetak_gambar.gif"],

	async simpanGambarKatalog(nama, file) {
		const fileGambar = file.files[0];
		if (fileGambar) {
			const formData = new FormData();
			formData.append("file", fileGambar, nama + ".jpeg");
			if (await modalShow(confirm, "Gambar sudah siap. Simpan sekarang?")) {
				showPopupLoading();
				try {
					const res = await fetch(url + "post_file/upload_foto_katalog", {
							method: "POST",
							body: formData
					});
					const response = await res.json();
					hidePopupLoading();
					await message(response)
				} catch (er) {
					await modalShow(gagal, pesanGagal);
				}
			}
		}
	}
	async gantiFotoKatalog(field, id) {
		field.innerHTML = "";
		const legend = document.createElement("legend");
		legend.className = "judul";
		const prev = document.createElement("img");
		prev.className = "image";
		const input = document.createElement("input");
		input.type = "file";
		input.accept = "image/*";
		input.capture = "environment";
		input.onchange = () => {
			const selected = input.files[0];
			if (selected) {
				const img = URL.createObjectURL(selected);
				prev.src = img;
				prev.style.display = "block";
			}
		}
		const produk = await getData("produk");
		const realName = produk.find(p => String(p.id_produk) === String(id))?.nama ?? "";
		if (realName) {
			legend.textContent = realName;
			const btn = makeButton("btn", "Simpan", () => this.simpanGambarKatalog(realName, input));
			for (const item of [legend, prev, input, btn]) {
				field.appendChild(item);
			}
		}
	}
	
	editProduk(id) {
		this.itemEdit = this.produk.find(item => String(item.id_produk) === String(id)) ?? null;
		if (this.itemEdit) {
			const wadah = pembuatJendela();
			const pr = makeParent("editor");
			wadah.appendChild(makeButton("invisible-btn", "Edit produk", null, "Pictures/edit.png"));
			wadah.appendChild(pr);
			const pr1 = makeParent("container");
			const pr2 = makeParent("container");
			const pr3 = makeParent("container");
			const pr4 = makeParent("container");

			this.ent = {}
			Object.entries(this.itemEdit).forEach((it, i) => {
					const [key, val] = it;
					let tipe = "text";
					if (![
							"id",
							"id_produk",
							"barcode",
							"jumlah_tertinggi"
						].includes(key.toLowerCase())) {
						if ([
								"harga_beli",
								"harga_jual",
								"harga_modal",
								"isi_satuan",
								"jumlah",
								"poin",
								"stok_minimum"
							].includes(key.toLowerCase())) {
							tipe = "number";
						}
						const entry = makeEntry("Masukkan " + key.replace(/_/g, " ") + " baru", tipe);
						entry.value = val;
						let parent = null;
						if (i < 6) {
							parent = pr1;
						} else if ( i >= 6 && i < 12) {
							parent = pr2;
						} else {
							parent = pr3;
						}
						parent.appendChild(makeLabel(key.replace(/_/g, " ").toUpperCase(), "teks"));
						parent.appendChild(entry);
						this.ent[key] = entry;
					}
			})

			for (const ip of [pr1, pr2, pr3, pr4]) {
				pr.appendChild(ip);
			}

			const kategori =  [...new Set(this.produk.map(p => p.kategori))];
			const satuanJual = [...new Set(this.produk.map(p => p.satuan_jual))];
			const satuanBeli = [...new Set(this.produk.map(p => p.satuan_beli))];
			const supplier = [...new Set(this.produk.map(p => p.supplier))];

			this.combKategori = pembuatCombo(pr4, "Pilih kategori", kategori);
			this.combSatuanJual = pembuatCombo(pr4, "Pilih satuan jual", satuanJual);
			this.combSatuanBeli = pembuatCombo(pr4, "Pilih satuan beli", satuanBeli);
			this.combSupplier = pembuatCombo(pr4, "Pilih supplier", supplier);

			const btns = [
				["btn", "Simpan", () => this.simpanEdit()]
			]
			pembuatButton(wadah, btns);
		}
	}
	
	async simpanEdit() {
		const result = Object.fromEntries(
			Object.entries(this.ent).map(([key, val]) => [key, val.value.trim()])
		);

		try {
			const ktgr = this.combKategori.value;
			const sj = this.combSatuanJual.value;
			const sb = this.combSatuanBeli.value;
			const sup = this.combSupplier.value;

			const kategori = ktgr !== "Pilih kategori" ? ktgr : (result.kategori ?? "");
			const satuanBeli = sb !== "Pilih satuan beli" ? sb : (result.satuan_beli ?? "");
			const satuanJual = sj !== "Pilih satuan jual" ? sj : (result.satuan_jual ?? "");
			const supplier = sup !== "Pilih supplier" ? sup : (result.supplier ?? "");

			const jumlah = Number(result.jumlah) || 0;
			const hargaBeli = safeFloat(result.harga_beli) || 0;
			const isiSatuan = Number(result.isi_satuan) || 0;

			const data = this.itemEdit;

			const stokTertinggi =
			(data.jumlah_tertinggi ?? 0) < jumlah
			? jumlah
			: (data.jumlah_tertinggi ?? 0);

			const hargaModal = jumlah > 0 ? (hargaBeli / jumlah) : 0;

			const choosenProduk = this.produk.filter(
				p => (p.id_produk || "") !== (data.id_produk || "")
			);

			for (const p of choosenProduk) {
				if ((p.nama || "").toLowerCase() === (result.nama || "").toLowerCase()) {
					await modalShow(gagal, "Terdeteksi duplikasi nama produk");
					return;
				}
			}

			if (await modalShow(confirm, "Simpan data sekarang?")) {
				const dataEdit = {
					nama_lama: data.nama ?? "",
					barcode_lama: data.barcode ?? "",
					id: data.id ?? 0,
					barcode: result.barcode ?? data.barcode,
					nama: result.nama ?? data.nama,
					catatan: result.catatan ?? data.catatan,
					kategori: kategori,
					kadaluarsa: result.kadaluarsa ?? data.kadaluarsa,
					satuan_beli: satuanBeli,
					satuan_jual: satuanJual,
					isi_satuan: isiSatuan,
					harga_beli: hargaBeli,
					harga_jual: safeFloat(result.harga_jual) || 0,
					jumlah: jumlah,
					stok_minimum: safeInt(result.stok_minimum) || 0,
					supplier: supplier,
					jumlah_tertinggi: stokTertinggi,
					poin: safeInt(result.poin) || 0
				};

				const datriw = {
					aksi: "Edit produk",
					nama_lama: data.nama || "",
					nama: result.nama,
					jumlah_lama: data.jumlah || 0,
					jumlah: jumlah,
					modal_lama: data.harga_modal || 0,
					harga_modal: hargaModal,
					jual_lama: data.harga_jual || 0,
					harga_jual: safeFloat(result.harga_jual) || 0,
					catatan_lama: data.catatan || "",
					catatan: result.catatan || "",
					barcode: data.barcode || "",
					operator: user,
					sumber: idDevice
				};

				const upload = await postDataKedua("edit_produk", {
						data: dataEdit,
						riwayat: datriw
				});
				await message(upload);
			}
		} catch (er) {
			console.error(er);
			await modalShow(gagal, String(er));
		}
	}

		if (item) {
			if (await modalShow(confirm, "Hapus produk " + item.nama + " sekarang?")) {
				const data = {
					aksi: "Hapus produk",

					id: item.id,

				}

				if (upload) {
					await modalShow(upload.stat, upload.pesan);
				} else {
					await modalShow(gagal, pesanGagal);
				}
				this.setup();
			}

	async tambahStok(id) {
		const item = this.produk.find(p => String(p.id_produk) === String(id)) ?? null;
		if (item) {
			const tambah = await modalShow("Tambahan", "Masukkan tambahan stok untuk " + item.nama, true);
			if (tambah) {
				const tambahan = safeInt(tambah);
				const stok = item.jumlah + tambahan;
				let tertinggi = item.jumlah_tertinggi;
				if (stok > tertinggi) {
					tertinggi = stok;
				}
				const datriw = {
					aksi: "Tambah stok",
					nama: item.nama,
					jumlah: tambahan,
					barcode: item.barcode,
					stok_terbaru: stok,
					operator: user,
					sumber: idDevice
				}
				const data = {
					tambahan: tambahan,
					jumlah_tertinggi: tertinggi,
					id_produk: item.id_produk
				}
				setTimeout(async () => {
					if (await modalShow(confirm, `Anda akan menambahkan stok ${item.nama} sebanyak ${tambahan}. Simpan sekarang?`, false)) {
						const upload = await postDataKedua("tambah_stok", {data_tambah: data, riwayat: datriw});
						await message(upload);
						this.setup();
					}
				}, 0);
			}
		}
	}

	detailProduk(id) {
		const item = this.produk.find(p => String(p.id_produk) === String(id)) ?? null;
		if (item) {
			const parent = pembuatJendela();
			const pr = makeParent("container");
			pr.style.display = "grid";
			pr.style.gridTemplateColumns = "repeat(3, 1fr)";

			for (const [key, value] of Object.entries(item)) {
				const labelKey = makeLabel(key.replace(/_/g, " "), "biasa");
				const titik = makeLabel(":", "biasa");
				let val = "";
				if (["harga_jual", "harga_beli", "harga_modal"].includes(key.toLowerCase())) {
					val = formatMataUang(value);
				} else {
					val = String(value);
				}
				const valLabel = makeLabel(val, "biasa");
				for (const p of [labelKey, titik, valLabel]) {
					pr.appendChild(p);
				}
			}
			parent.appendChild(pr);
		}
	}
	
	cariProdukFunc(teks="") {
		this.filterProduk = [];
		for (const item of this.produk) {
			if (
				item.nama.toLowerCase().includes(teks.toLowerCase()) ||
				item.barcode.includes(teks) ||
				item.kategori.toLowerCase().includes(teks.toLowerCase())
			) { this.filterProduk.push(item); }
		}
		this.sudahMuat = 0;
		this.findProduk();
	}

	filterKategoriFunc(){
		const kategori = this.ktgr.value.toLowerCase();
		if (["", "semua kategori"].includes(kategori)){
			this.filterProduk = this.produk;
			return this.findProduk();
		}
		this.sudahMuat = 0;
		this.filterProduk = this.produk.filter(a => a.kategori.toLowerCase() === kategori);
		this.findProduk();
	}

	findProduk() {
		if (this.sudahMuat >= this.filterProduk.length) return;
		this.div.innerHTML = "";
		const forShow = this.filterProduk.slice(this.sudahMuat, this.sudahMuat + this.perMuat);
		const tabel = makeTable(`
			<tr>
				<th><button class="btns" onclick="produk.showAndHide()"><img src="${url}Pictures/fullscreen.png" class="icon" alt=""></button>  Barcode</th>
				<th>Nama produk</th>
				<th>Kategori</th>
				<th>Harga jual</th>
				<th>Harga termasuk pajak</th>
				<th>Harga modal</th>	
				<th>Jumlah stok</th>
				<th>Aksi</th>
			</tr>
		`);
		this.div.appendChild(tabel);
		
		for (const item of forShow) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.barcode}</td>
				<td>${item.nama}</td>
				<td>${item.kategori}</td>
				<td>${formatMataUang(item.harga_jual)}</td>
				<td>
					${formatMataUang(Math.round(item.harga_jual * (1 + this.persen / 100)))}
				</td>
				<td>${formatMataUang(Math.round(item.harga_modal))}</td>
				<td>${item.jumlah} ${item.satuan_jual}</td>
				<td style="display: flex;">
					<button class="invisible-btn" onclick="produk.detailProduk('${item.id_produk}')"><img src="${url}Pictures/cari.png" class="icon"></button>
					<button class="invisible-btn" onclick="produk.tambahStok('${item.id_produk}')"><img src="${url}Pictures/add.png" class="icon"></button>
					<button class="invisible-btn" onclick="produk.editProduk('${item.id_produk}')"><img src="${url}Pictures/edit.png" class="icon"></button>
					<button class="invisible-btn" onclick="produk.hapusProduk('${item.id_produk}')"><img src="${url}Pictures/hapus.png" class="icon"></button>
				</td>
			`
			tr.addEventListener("click", (e) => {
				if (!e.target.closest("button")) {
					this.showPicture(item.nama, item.id_produk);
				}
			})
			tabel.appendChild(tr);
		}

			if (pj.aktif === 1) {

	async simpanTingkat() {
		const path = this.path.value;
		if (path.toLowerCase() === "pilih tingkat") {
			await modalShow(gagal, "Silahkan pilih tingkat terlebih dahulu");
			return;
		}
		const hargaJual = this.entTingkat.harga.value.trim();
		const minimum = this.entTingkat.min.value.trim();
		if (![hargaJual, minimum].every(Boolean)) {
			await modalShow(gagal, "Silahkan masukkan harga jual dan minimum pembelian terlebih dahulu");
			return;
		}
		const id = this.tengah.querySelector("input:checked")?.value;
		const produk = this.produk.find(p => (p.id_produk || "") === (id || "")) ?? null;
		if (!produk) {
			await modalShow(gagal, "Produk tidak ditemukan");
			return;
		}

		const pathQuery = path.replace(/ /g, "_").toLowerCase();
		const hj = safeFloat(hargaJual);
		const min = safeInt(minimum);
		const data = {
			id_produk: produk.id_produk,
			barcode: produk.barcode,
			nama: produk.nama,
			harga_modal: produk.harga_modal * min,
			harga_jual: hj,
			min_beli: min,
			path: pathQuery
		}
		if (await modalShow(confirm, "Data telah siap. Simpan sekarang?")) {
			const upload = await postDataKedua("tambah_tingkat_produk", data);
			await message(upload);
		}
	}

		}

	filterProdukPerKategori(kategori) {
		if (kategori.toLowerCase() === "pilih kategori") {
			this.produkPerKategori = this.produk;
		} else {
			const filter = this.produk.filter(p => p.kategori.toLowerCase() === kategori.toLowerCase());
			this.produkPerKategori = filter;
		}
		this.showProdukKategori();
	}

	kalkulasiTingkat(p = 0) {
		const min = safeInt(p);
		const id = this.tengah.querySelector("input:checked")?.value;
		const produk = this.produk.find(p => p.id_produk === id) ?? null;
		if (produk) {
			const hm = (produk.harga_modal || 0) * min
			const hj = (produk.harga_jual || 0) * min
			const kn = hj - hm
			const rkm = 50/100 * kn
			const rhjm = hm + rkm
			this.labelInfoTingkat.textContent = `
					Harga modal normal: ${formatMataUang(hm)}
					Harga jual normal: ${formatMataUang(hj)}
					Keuntungan normal: ${formatMataUang(kn)}
					Rekomendasi keuntungan minimal: ${formatMataUang(rkm)}
					Rekomendasi harga jual minimal: ${formatMataUang(rhjm)}
		
					Rekomendasi harga jual minimal diperoleh dari:
					50% keuntungan normal dan harga jual normal
				`
		}
	}

	kalkulasiDiskon(p=0) { 
		const id = this.frameProduk.querySelector("input:checked")?.value;
		const item = this.produk.find(p => (p.id_produk || "") === (id || ""));
		const hm = item.harga_modal;
		const hj = item.harga_jual;
		const hjb = hj * (1 - p / 100);
		const ekn = hj - hm;
		const ekb = hjb - hm;
		const teks = `
				PRODUK: ${item.nama.toUpperCase()}
				
				Harga modal produk: ${formatMataUang(hm)}
				Harga jual normal: ${formatMataUang(hj)}
				Harga jual baru: ${formatMataUang(hjb)}
				Estimasi keuntungan normal: ${formatMataUang(ekn)}
				Estimasi keuntungan baru: ${formatMataUang(ekb)}
				Keuntungan dikurangi: ${formatMataUang(ekn - ekb)}

				Kalkulasi ini ditujukan untuk 1 unit produk dalam satuan jual terkecil
				(pcs, unit, bungkus, kaleng, dan lain-lain).
			`
		this.labelInfoDiskon.textContent = teks;
	}

	async hapusProdukDiskon(id) {
		if (await modalShow(confirm, "Hapus produk sekarang?")) {
			const hapus = await postDataKedua("hapus_produk_diskon", {id: id});
			await message(hapus);
			this.daftarProdukDiskon();
		}
	}

	showAndHide() {
		if (this.kiri.style.display === "none") {
			this.kiri.style.display = "flex";
		} else {
			this.kiri.style.display = "none";
		}
	}
	
	mulaiTambah(parent, data, btn) {
		parent.innerHTML = "";
		btn.textContent = "Simpan";
		let dataHasil = {};
		data.forEach((item, i) => {
			const lbl = makeLabel(`${i+1}. ${item.nama}`, "biasa");
			parent.appendChild(lbl);
			const inp = entryMaker("Masukkan stok...", "number", "Pictures/add.png", parent);
			dataHasil[item.id_produk] = inp;
		});
		const inputs = parent.querySelectorAll("input");
		inputs[0].focus();
		inputs.forEach((inp, i) => {
			inp.addEventListener("keydown", (e) => {
				if (e.key === "Enter") {
					if (i >= inputs.length - 1) { inputs[0].focus(); }
					else { inputs[i+1].focus(); }
				}
			});
		});
		btn.onclick = async () => {
			let suk = "Berhasil: ";
			let gagal = "Gagal: ";
			const hasil = pecahObject(dataHasil);
			for (const [id, tambah] of Object.entries(hasil)) {
				const tambahan = safeInt(tambah);
				const produk = await getData("produk");
				const item = produk.find(p => p.id_produk === id);
				if (!item) continue;
				if (tambahan <= 0) {
					gagal += `${item.nama}, `;
					continue;
				}
				const stok = item.jumlah + tambahan;
				let tertinggi = item.jumlah_tertinggi;
				if (stok > tertinggi) tertinggi = stok;
				const datriw = {
					aksi: "Tambah stok",
					nama: item.nama,
					jumlah: tambahan,
					barcode: item.barcode,
					stok_terbaru: stok,
					operator: user,
					sumber: idDevice
				}
				const data = {
					tambahan: tambahan,
					jumlah_tertinggi: tertinggi,
					id_produk: item.id_produk
				}
				const upload = await postDataKedua("tambah_stok", { data_tambah: data, riwayat: datriw });
				if (upload.stat.toLowerCase() === "berhasil") {
					suk += `${item.nama}, `;
				} else { gagal += `${item.nama}, `; }
			}
			await modalShow(berhasil, `${suk}\n${gagal}`);
		}
	}
	
	tambahStokMassal(p) {
		const produk = [];
		p.innerHTML = "";
		const cari = entryMaker("Masukkan barcode atau nama produk...", "text", "Pictures/barcode.png", p);
		const fr = makeParent("container");
		fr.style.display = "grid";
		fr.style.gridTemplateColumns = "repeat(2,1fr)";
		fr.style.alignItems = "center";
		
		const btn = makeButton("btn", "Mulai tambah stok", () => this.mulaiTambah(fr, produk, btn));
		for (const pr of [fr, btn]) p.appendChild(pr);
		cari.addEventListener("keydown", async (e) => {
			if (e.key === "Enter") {
				const br = cari.value;
				if (br === "") return this.mulaiTambah(fr, produk, btn);
				const ada = this.mapBarcode[br];
				if (!ada) {
					await modalShow(gagal, "Produk tidak ditemukan");
					return
				}
				const sudahAda = produk.find(p => p.barcode === ada.barcode);
				if (!sudahAda) {
					produk.push(ada);
					fr.innerHTML = "";
					produk.forEach((item, i) => {
						const label = makeLabel(`${i+1}. ${item.nama}`, "biasa");
						fr.appendChild(label);
					});
					cari.value = "";
					cari.focus();
				}
			}
		});
		p.querySelector("img").onclick = () => this.bukaScanner(cari, true);
	}
		
	laporanStok() {
		this.kanan.innerHTML = "";
		const atas = makeParent("container-horizontal");
		const tengah = makeParent("container");
		for (const i of [atas,tengah]) this.kanan.appendChild(i);
		pembuatButton(atas, [
			["btn", "Tambah stok massal", () => this.tambahStokMassal(tengah)]
		]);
		this.kanan.appendChild(makeButton("btn", "Berikutnya", () => this.tampilkanStok(tengah)));
		this.tampilkanStok(tengah);
	}
	
	tampilkanStok(p) {
		p.innerHTML = "";
		const berikutnya = this.semuaData.slice(this.sudahTampil, this.sudahTampil + this.perLoad);
		const tabel = makeTable(`
			<tr>
				<th>Barcode</th>
				<th>Nama</th>
				<th>Jumlah</th>
				<th>Stok minimum</th>
				<th>Range</th>
				<th>Status</th>
			</tr>
		`);
		p.appendChild(tabel);
		for (const item of berikutnya) {
			let status = "Tersedia";
			let warna;
			let slideColor = "green";
			if (item.jumlah > 0 && item.jumlah <= item.stok_minimum) {
				status = "Kurang";
				warna = "#F1F2B2";
				slideColor = "yellow";
			} else if (item.jumlah <= 0) { status = "Habis"; warna = "#ED7577"; }
			
			const persen = Math.round(item.jumlah / item.jumlah_tertinggi * 100);
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td style="background: ${warna};">${item.barcode}</td>
				<td style="background: ${warna};">${item.nama}</td>
				<td style="background: ${warna};">${item.jumlah} ${item.satuan_jual}</td>
				<td style="background: ${warna};">${item.stok_minimum} ${item.satuan_jual}</td>
				<td style="display: flex; align-items: center;">
					<input type="range" min="0" max="${item.jumlah_tertinggi}" value="${item.jumlah}" style="accent-color: ${slideColor};">
					<p class="biasa">${persen}%</p>
				</td>
				<td style="background: ${warna};">${status}</td>
			`;
			tabel.appendChild(tr);
		}
		this.sudahTampil += berikutnya.length;
	}
	
	async setup() {
		resetJudul("Produk");
		const main = document.querySelector(".tengah");
		main.innerHTML = "";
		this.produk = await getData("produk");
		this.tingkat_a = await getData("tingkat_a");
		this.tingkat_b = await getData("tingkat_b");
		this.filterProduk = [...this.produk];
		const wadah = makeParent("big-container");
		
		this.mapBarcode = Object.fromEntries(this.produk.map(p => [p.barcode, p]));
		
		this.kiri = makeParent("profil-container");
		this.kanan = makeParent("right-container");
		for (const frame of [this.kiri, this.kanan]) {
			wadah.appendChild(frame);
		}
		this.semuaData = this.filterProduk.sort((a,b) => a.jumlah - b.jumlah);
		this.perLoad = 100;
		this.sudahTampil = 0;
		
		main.appendChild(wadah);
		this.setKiri();
		this.daftarProduk();
	}
}

class Transaksi {
	constructor() {
		this.produk = null;
		this.pajak = null;
		this.qr = null;
		this.inputAktif = null;
		this.isPending = false;
		this.bayar = 0;
		this.kembali = 0;
		this.noTrans = "";
		this.sudahBayar = 0;
		this.namaPembeli = "";
		this.nomorTelepon = "";
		document.addEventListener("click", (e) => {
				if (this.inputAktif && !e.target.closest("button, input, select, textarea")) {
					this.refocusInput();
				}
		});
		this.hasil = [];
		this.hasilPencarian = [];
		this.arrUndo = [];
		this.arrRedo = [];
	}
	
	doUndo() {
		if (keranjang.length) {
			this.arrRedo.push(keranjang);
			keranjang = [];
		}
		if (this.arrUndo.length > 0) {
			const last = this.arrUndo.pop();
			keranjang = last;
			this.tambahkanSecondKeranjang();
		}
	}
	
	doRedo() {
		if (keranjang.length) {
			this.arrUndo.push(keranjang);
			keranjang = [];
		}
		if (this.arrRedo.length > 0) {
			const last = this.arrRedo.pop();
			keranjang = last;
			this.tambahkanSecondKeranjang();
		}
	}
	
	generateNoTrans() {
		const tipe1 = String(inisialCode).slice(0,1).toUpperCase();
		const tipe2 = Math.floor(Math.random() * 100) + 10;
		const tipe3 = Math.floor(Math.random() * 900000) + 100000;
		this.noTrans = String(tipe1) + String(tipe2) + "_" + String(tipe3);
	}
	refocusInput() {
		if (this.inputAktif) {
			this.inputAktif.focus();
		}
	}
	operasiQty(id, tipe) {
		const item = keranjang.find(p => String(p.id) === String(id)) ?? null;
		if (!item) {
			return;
		}
		if (tipe === "-") {
			if (item.qty > 0) {
				item.qty -= 1;
			}
		} else {
			const jumlah = this.produk.find(p => String(p.id_produk) === String(id))?.jumlah ?? 0;
			if (item.qty < jumlah) {
				item.qty += 1;
			}
		}
		this.tambahkanSecondKeranjang();
	}
	async aktifkanPajak() {
		await postDataKedua("pajak_selalu_aktif", {aktif: this.termasukPajak.checked});
	}
	async sertakanQr() {
		await postDataKedua("cetak_qr_di_struk", {status: this.cetakQr.checked});
	}
	
	prepareAtas() {
		this.termasukPajak = makeCekTrx(this.atas, "Termasuk pajak");
		this.cetakQr = makeCekTrx(this.atas, "Cetak qr/barcode");
		this.termasukPajak.checked = this.aktif || 0;
		this.termasukPajak.onchange = () => this.aktifkanPajak();
		this.cetakQr.checked = this.qrAktif || 0;
		this.cetakQr.onchange = () => this.sertakanQr();

		pembuatButtonGambar(this.atas, [
				["btns2", "Kalkulator", () => kalkulator.setup(), "Pictures/kalkulator.png"],
				["btns2", "Undo", () => this.doUndo(), "Pictures/undo.png"],
				["btns2", "Redo", () => this.doRedo(), "Pictures/redo.png"],
				["btns2", "Refresh", () => this.doRefresh(), "Pictures/refresh.png"],
				["btns2", "Kembali", async () => { try { await fetch(url); window.location.href = url; } catch { await modalShow(gagal, "Koneksi server tidak aktif. Anda akan tetap di menu transaksi"); }}, "Pictures/kembali.png"]
		]);
	}
	
	doRefresh() {
		if (keranjang.length) {
			this.arrUndo.push(keranjang);
		}
		secondKeranjang.length = 0;
		keranjang = [];
		totalBelanja = 0
		this.labelTotal.textContent = formatMataUang(totalBelanja);
		this.setup();
	}
	prepareAtasTengah() {
		const kiri = makeParent("container");
		kiri.style.width = "fit-content";
		const kanan = makeParent("container");
		kanan.style.flex = "1";
		kanan.style.width = "100%";
		this.labelUser = makeButton("btns", user.toUpperCase(), null, "Pictures/username.png");
		this.labelNoTrans = makeButton("btns", `Nomor transaksi: ${this.noTrans}`, null, "Pictures/transaksi_cadangan.png");
		for (const item of [this.labelUser, this.labelNoTrans]) { kiri.appendChild(item); }
		
		this.labelTotal = makeLabel(formatMataUang(totalBelanja), "total");
		kanan.appendChild(this.labelTotal);

		for (const item of [kiri, kanan]) {
			this.atasTengah.appendChild(item);
		}
	}
	
	setEmptyRow() {
		const tr = document.createElement("tr");
		tr.innerHTML = `
				<td>
					<input class="invisible-input" id="input-barcode">
				</td>
				<td></td>
				<td></td>
				<td></td>
				<td></td>
			`
		this.tabel.appendChild(tr);
		this.inputAktif = tr.querySelector("#input-barcode");
		this.refocusInput();

		this.inputAktif.oninput = () => this.searchProduk(this.inputAktif.value.trim());
		this.inputAktif.addEventListener("keydown", (e) => {
				if (e.key === "Enter") {
					e.preventDefault();
					const val = this.inputAktif.value.trim();
					if (val === "") { this.checkoutBayar(); }
					else {
						const isBarcode = this.mapBarcode[val];
						if (!isBarcode) {
							const pop = document.querySelector(".produk-pop");
							const allInp = pop.querySelectorAll("input");
							if (allInp.length > 0) {
								allInp[0].focus();
							}
						} else { this.tambahKeranjang(val,1); }
					}
				} else if (e.key === "Tab") {
					e.preventDefault();
					const inputQty = this.tabel.querySelectorAll("#input-qty");
					if (inputQty.length > 0){
						inputQty[0].focus();
					}
				}
		});
	}
	hitungKembalian(bayar) {
		if (["0", ""].includes(bayar)) {
			this.kembalian.textContent = "Kembali: " + formatMataUang(0);
			this.kembalian.style.color = "red";
			return
		}
		this.bayar = safeFloat(bayar);
		const totalAsli = totalBelanja - this.sudahBayar;
		this.kembali = this.bayar - totalAsli;
		let warna = "green";
		if (this.kembali < 0) {
			warna = "red";
		}
		this.kembalian.textContent = "Kembali: " + formatMataUang(this.kembali);
		this.kembalian.style.color = warna;
	}
	async resetTransaksi() {
		infoCadangan = {};
		this.isPending = false;
		secondKeranjang.length = 0;
		keranjang.length = 0;
		this.bayar = 0;
		this.nomorTelepon = "";
		this.namaPembeli = "";
		this.sudahBayar = 0;
		this.kembali = 0;		
		this.generateNoTrans();
		hideWindow();
		this.lihatKeranjang();
	}
	async transaksiSelesai() {
		const jumlahBayar = this.sudahBayar + this.bayar;
		if (secondKeranjang.length === 0) {
			await modalShow(gagal, "Keranjang kosong");
			return;
		}
		if (jumlahBayar < totalBelanja) {
			await modalShow(gagal, "Pembayaran tidak cukup");
			return;
		}
		const namaPembeli = this.infoBuyer.nama.value.trim();
		const kontakPembeli = this.infoBuyer.kontak.value.trim();
		const pembeli = `${namaPembeli} ${kontakPembeli}`;
		
		const data = {
			items: secondKeranjang,
			total: safeFloat(totalBelanja),
			bayar: safeFloat(jumlahBayar),
			kembali: safeFloat(this.kembali),
			sumber: String(idDevice),
			operator: String(user),
			no_trans: this.noTrans,
			pembeli: pembeli,
			is_pending: this.isPending,
		}
	
		try {
			const res = await fetch(`${url}penjualan_campuran`, {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify(data)
			});
			
			const pesan = await res.json();
			if (pesan.stat.toLowerCase() === "berhasil") {
				if (await modalShow(pesan.stat, pesan.pesan, false)) {
					await cetakStruk(data);
					this.resetTransaksi();
				} else { this.resetTransaksi(); }
			} else { await modalShow(pesan.stat, pesan.pesan); }
		} catch {
			const trxOff = localStorage.getItem("transaksi_offline");
			const trans = trxOff ? JSON.parse(trxOff) : [];
			trans.push(data);
			localStorage.setItem("transaksi_offline", JSON.stringify(trans));
			if (await modalShow("Tersimpan", "Koneksi server terganggu. Riwayat transaksi telah disimpan sementara. Cetak struk penjualan?", false)) {
				await cetakStruk(data, false);
				this.resetTransaksi();
			} else { this.resetTransaksi(); }
		}
	}
	
	async checkoutBayar() {
		if (keranjang.length === 0) {
			await modalShow(gagal, "Keranjang kosong");
			return;
		}
		document.querySelector(".lc").style.background = "transparent";
		const wadah = pembuatJendela();
		
		const wadahUtama = pembuatField(wadah, "MENU PEMBAYARAN");
		const atas = makeParent("container-horizontal");
		const bawah = makeParent("container");
		const totalQty = secondKeranjang.reduce((sum, a) => sum + a.qty_asli, 0);

		let teksTotal = "Total belanja: " + formatMataUang(totalBelanja);
		if (this.sudahBayar > 0) {
			const belumBayar = totalBelanja - this.sudahBayar;
			teksTotal = "Total belum dibayar: " + formatMataUang(belumBayar);
		}
		atas.appendChild(makeLabel(teksTotal, "tot"));
		this.kembalian = makeLabel("Kembali: " + formatMataUang(0), "change");
		atas.appendChild(this.kembalian);
		
		this.infoBuyer = pembuatEntry(bawah, [
				["jumlah_bayar", "Jumlah pembayaran", "number"],
				["nama", "Nama pembeli", "text"],
				["kontak", "Nomor telepon/WhatsApp pembeli", "number"]
		])
		
		const labelQty = makeLabel("Total qty: " + formatUnit(totalQty, "unit"), "jdl");
		const btnSelesai = makeButton("btn", "Selesai", () => this.transaksiSelesai());
		labelQty.style.height = "100%";
		for (const x of [labelQty, btnSelesai]) bawah.appendChild(x);
	
		const inputUang = this.infoBuyer["jumlah_bayar"];
		this.infoBuyer.nama.value = this.namaPembeli;
		this.infoBuyer.kontak.value = this.nomorTelepon;
		inputUang.oninput = () => this.hitungKembalian(inputUang.value.trim());
		
		this.infoBuyer.kontak.addEventListener("keydown", (e) => {
			if (e.key === "Enter") { e.preventDefault(); this.transaksiSelesai(); }
		});

		for (const frame of [atas, bawah]) wadahUtama.appendChild(frame);
		inputUang.focus();
	}
	
	prepareTengah() {
		const frame = makeParent("container");
		this.tabel = makeTable(`
				<tr>
					<th>Nama</th>
					<th>Qty</th>
					<th>Promo</th>
					<th>Harga</th>
					<th>Subtotal</th>
				</tr>
			`)
		frame.appendChild(this.tabel);
		this.setEmptyRow();
		this.tengah.appendChild(frame);
		this.refocusInput();
	}
	hapusKeranjang(id) {
		keranjang = keranjang.filter(p => String(p.id) !== String(id));
		this.tambahkanSecondKeranjang();
	}
	lihatKeranjang() {
		const pop = document.querySelector(".produk-pop");
		pop.classList.add("hidden");
		const tbody = this.tabel.tBodies[0];
		tbody.innerHTML = "";
		for (const item of secondKeranjang) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
					<td>
						<img id="hapus" class="icon" onclick="transaksi.hapusKeranjang('${item.id}')">
						${item.nama}
					</td>
					<td style="display: flex;">
						<button class="btns2" onclick="transaksi.operasiQty('${item.id}', '-')">➖</button>
						<input type="number" id="input-qty" class="entry" value="${item.qty}"
							onkeydown="if(event.key==='Enter') transaksi.editQty('${item.id}', this.value)">
						<button class="btns2" onclick="transaksi.operasiQty('${item.id}', '+')">➕</button>
					</td>
					<td>${item.tipe_promo}</td>
					<td>${formatMataUang(item.harga_jual)}</td>
					<td>${formatMataUang(item.subtotal_jual)}</td>
				`;
			this.tabel.appendChild(tr);
			const hps = tr.querySelector("#hapus");
			hps.src = "Pictures/hapus.png";
		}
		this.setEmptyRow();
	}
	
	async editQty(id, qty){
		const q = safeInt(qty);
		if (q <= 0){ keranjang = keranjang.filter(a => String(a.id) !== String(id)); return this.tambahkanSecondKeranjang(); }
		const findP = this.produk.find(produk => String(produk.id_produk) === String(id)) ?? Null;
		if (findP.jumlah >= q){
			const find = keranjang.find(a => String(a.id) === String(id)) ?? null;
			if (find){
				find.qty = q;
				this.tambahkanSecondKeranjang();
			}
		} else { await modalShow(gagal, "Jumlah stok tidak cukup"); }
	}
	
	async tambahkanSecondKeranjang() {
		try {
			const hasilValidasi = await fetch(url + "tambahkan_second_keranjang", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
					},
					body: JSON.stringify(keranjang)
			});
			const result = await hasilValidasi.json()
			totalBelanja = result.total
			this.labelTotal.textContent = "Total: " + formatMataUang(result.total);
			secondKeranjang = result.data || [];
			this.lihatKeranjang();
		} catch {
			this.operasiSecondKeranjang();
			totalBelanja = secondKeranjang.reduce((sum, a) => sum + a.subtotal_jual, 0);
			this.labelTotal.textContent = "Total: " + formatMataUang(totalBelanja);
			this.lihatKeranjang(); 
		}
	}
	
	searchProduk(teks="") {
		this.hasilPencarian.length = 0;
		if (teks === "") { document.querySelector(".produk-pop").classList.add("hidden"); return; }
		for (const item of this.produk) {
			if (
				item.nama.toLowerCase().includes(teks.toLowerCase()) ||
				item.barcode.includes(teks) ||
				item.id_produk.includes(teks) ||
				item.kategori.toLowerCase().includes(teks.toLowerCase())
			) {
				this.hasilPencarian.push(item);
			}
		}
		this.tampilkanProduk();
	}
	
	tampilkanProduk() {
		const wadah = document.querySelector(".produk-pop");
		wadah.classList.remove("hidden");
		wadah.innerHTML = "";
		const rect = this.inputAktif.getBoundingClientRect();
		wadah.style.top = (rect.bottom + 5) + "px";
		wadah.style.left = rect.left + "px";
		wadah.style.minWidth = String(Number(rect.width) + Number(rect.width) / 2)+ "px";
		const tabel = makeTable(`
				<tr>
					<th>Barcode</th>
					<th>Nama produk</th>
					<th>Jumlah stok</th>
					<th>Harga jual</th>
					<th>Aksi</th>
				</tr>
			`)
		wadah.appendChild(tabel);
		
		for (const item of this.hasilPencarian.slice(0,10)) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.barcode}</td>
				<td>${item.nama}</td>
				<td>${item.jumlah} ${item.satuan_jual}</td>
				<td>${formatMataUang(item.harga_jual)}</td>
				<td style="display: flex; gap: 5px; background: transparent;">
					<input class="entry" type="number">
					<button class="btn" onclick="transaksi.tambahKeranjang('${item.id_produk}', this.previousElementSibling.value)">Tambah</button>
				</td>
			`;
			tabel.appendChild(tr);
			const inp = tr.querySelector("input");
			inp.addEventListener("keydown", (e) => {
				if (e.key === "Enter") {
					e.preventDefault();
					const val = safeInt(inp.value.trim());
					if (val <= 0) {
						const inputs = tabel.querySelectorAll("input");
						const idx = Array.from(inputs).indexOf(inp);
						const next = inputs[idx+1] || this.inputAktif;
						next.focus();
					} else { this.tambahKeranjang(item.id_produk, val); }
				}
			});
		}
	}
	
	async tambahKeranjang(id, qty) {
		if ([NaN, "", "0"].includes(qty)) {
			return;
		}
		qty = safeInt(qty);
		const item = this.produk.find(p => String(p.id_produk) === String(id) || String(p.barcode) === String(id) || String(p.nama.toLowerCase()) === String(id.toLowerCase())) ?? null;
		if (item) {
			const foundKeranjang = keranjang.find(p => String(p.id) === String(item.id_produk)) ?? null;
			if (foundKeranjang) {
				const totalQty = foundKeranjang.qty + qty
				if (totalQty > item.jumlah) {
					await modalShow(gagal, "Stok produk tidak cukup");
					return
				}
				foundKeranjang["qty"] = totalQty;
			} else {
				if (qty > item.jumlah) {
					await modalShow(gagal, "Stok produk tidak cukup");
					return
				}
				keranjang.push({
						nama: item.nama,
						barcode: item.barcode,
						id: item.id_produk,
						qty: qty,
						harga: item.harga_jual
				})
			}
		} else {
			await modalShow(gagal, "Produk tidak ditemukan");
			return;
		}
		hideWindow();
		this.tambahkanSecondKeranjang();
	}
	
	cariProduk(teks="", tabel=null) {
		this.hasil.length = 0;
		for (const item of this.produk) {
			if (
				item.nama.toLowerCase().includes(teks.toLowerCase()) ||
				item.barcode.includes(teks) ||

	}

					} else {

	}

	async simpanKeranjangSekarang(entr) {
		const nama = entr.nama.value.trim();
		const jumlahBayar = entr["jumlah bayar"].value.trim();
		let bayar = 0;
		if (![NaN, "0", ""].includes(jumlahBayar)) {
			bayar = safeFloat(jumlahBayar);
		}
		const data = {
			no: this.noTrans,
			nama: nama,
			dibayar: bayar,
			status: "Belum lunas",
			dt: keranjang
		}

		if (await modalShow(confirm, "Data siap. Simpan sekarang?")) {
			const upload = await postDataKedua("simpan_keranjang", data);
			if (upload) {
				await modalShow(upload.stat, upload.pesan);
				await hideWindow();
				this.doRefresh();

	async simpanKeranjang() {

	async muatUlangCadangan(data, no) {
		const item = data.find(p => String(p.no) === String(no)) ?? null;
		if (["sudah dilunasi", "lunas"].includes(item["status"].toLowerCase())) {
			await modalShow(gagal, "Transaksi nomor " + item.no + " telah dibayar lunas");
			return;
		}
		hideWindow();
		keranjang = JSON.parse(item.keranjang);
		const infoPembeli = item.nama_pembeli.split(" ");
		if (infoPembeli.length >= 2) {
			const nope = infoPembeli.at(-1);
			if (/^\d+$/.test(nope)) {
				this.nomorTelepon = nope;
				this.namaPembeli = infoPembeli.slice(0, -1).join(" ");
			} else {
				this.namaPembeli = item.nama_pembeli;
			}
		} else {
			this.namaPembeli = item.nama_pembeli;
		}
		this.noTrans = item.no;
		this.isPending = true;
		this.sudahBayar = item.jumlah_dibayar;
		this.labelNoTrans.textContent = `Nomor transaksi: ${this.noTrans}`;
		this.tambahkanSecondKeranjang();
	}

	olahCadangan() {
		if (infoCadangan !== {}) {
			const d = infoCadangan;
			keranjang = JSON.parse(d.keranjang);
			this.noTrans = d.no;
			this.labelNoTrans.textContent = `Nomor transaksi: ${this.noTrans}`;

		}

	handleShortcut(event){
		if (event.ctrlKey && event.key === "p"){
			event.preventDefault();
			this.listProduk();
		} else if (event.ctrlKey && event.key === "s"){
			event.preventDefault();
			this.simpanKeranjang();
		}
	}
	
	makeListener() {
		document.removeEventListener("keydown", handleShortcut);
		document.addEventListener("keydown", handleShortcut);
	}
	
	getPajak() {
		if (this.pajak.length) {
			const pjk = this.pajak[0];
			return [pjk.aktif ?? 0, pjk.persen ?? 0];
		} else { return [0, 0]; }
	}
	
	operasiSecondKeranjang() {
		secondKeranjang.length = 0;
		const [statusPajak, persenPajak] = this.getPajak();
		for (const item of keranjang) {
			const idProduk = item.id ?? "";
			let qtySisa = item.qty ?? 0;
			const nama = item.nama ?? "";
			const barcode = item.barcode ?? "";
			const harga = item.harga ?? 0;
			
			const findB = this.B.find(p => p.id_produk === idProduk && p.min_beli <= qtySisa);
			if (findB) {
				const qtyB = Math.floor(qtySisa / findB.min_beli);
				qtySisa %= findB.min_beli;
				const hargaSatuan = kenaPajak(
					findB.harga_jual,
					statusPajak,
					persenPajak
				);
				const subtotalModal = findB.harga_modal * qtyB;
				secondKeranjang.push({
					"id": idProduk,
					"nama": `${findB.nama} x${findB.min_beli}`,
					"barcode": findB.barcode,
					"qty": qtyB,
					"qty_asli": qtyB * findB.min_beli,
					"harga_jual": Math.round(hargaSatuan),
					"subtotal_jual": Math.round(hargaSatuan * qtyB),
					"harga_modal": Math.round(findB.harga_modal),
					"subtotal_modal": Math.round(subtotalModal),
					"laba": Math.round((findB.harga_jual * qtyB) - subtotalModal),
					"harga_asli": Math.round(harga),
					"potongan_tingkat": Math.round(
						hitungPotonganTingkat(
							harga,
							findB.min_beli,
							findB.harga_jual,
							statusPajak,
							persenPajak
						) * qtyB
					),
					"potongan_diskon": Math.round(0),
					"min_diskon": "",
					"min_tingkat": findB.min_beli,
					"tipe_promo": "tingkat",
					"persen_pajak": persenPajak
				});
			}
			const findA = this.A.find(p => p.id_produk === idProduk && p.min_beli <= qtySisa);
			if (findA) {
				const qtyA = Math.floor(qtySisa / findA.min_beli);
				qtySisa %= findA.min_beli;
				const hargaSatuan = kenaPajak(
					findA.harga_jual,
					statusPajak,
					persenPajak
				);
				const subtotalModal = findA.harga_modal * qtyA;
	
				secondKeranjang.push({
					"id": idProduk,
					"nama": `${findA.nama} x${findA.min_beli}`,
					"barcode": findA.barcode,
					"qty": qtyA,
					"qty_asli": qtyA * findA.min_beli,
					"harga_jual": Math.round(hargaSatuan),
					"subtotal_jual": Math.round(hargaSatuan * qtyA),
					"harga_modal": Math.round(findA.harga_modal),
					"subtotal_modal": Math.round(subtotalModal),
					"laba": Math.round((findA.harga_jual * qtyA) - subtotalModal),
					"harga_asli": Math.round(harga),
					"potongan_tingkat": Math.round(
						hitungPotonganTingkat(
							harga,
							findA.min_beli,
							findA.harga_jual,
							statusPajak,
							persenPajak
						) * qtyA
					),
					"potongan_diskon": Math.round(0),
					"min_diskon": "",
					"min_tingkat": findA.min_beli,
					"tipe_promo": "tingkat",
					"persen_pajak": persenPajak
				});
			}
			if (qtySisa > 0) {
				const produkRow = this.produk.find(p => p.id_produk === idProduk);
				const hargaModal = produkRow ? produkRow.harga_modal : 0;
				const subtotalModal = hargaModal * qtySisa;

				const findDiskon = this.diskon.find(p =>
					p.nama.toLowerCase() === nama.toLowerCase() &&
					p.barcode === barcode &&
					p.min <= qtySisa
				);
				if (findDiskon) {
					const hargaSetelahDiskon =
						findDiskon.harga_jual *
						(1 - findDiskon.persen / 100);
	
					const hargaJual = kenaPajak(
						hargaSetelahDiskon,
						statusPajak,
						persenPajak
					);
	
					secondKeranjang.push({
						"id": idProduk,
						"nama": nama,
						"barcode": barcode,
						"qty": qtySisa,
						"qty_asli": qtySisa,
						"harga_jual": Math.round(hargaJual),
						"subtotal_jual": Math.round(hargaJual * qtySisa),
						"harga_modal": Math.round(hargaModal),
						"subtotal_modal": Math.round(subtotalModal),
						"laba": Math.round(
							(hargaJual * qtySisa) - subtotalModal
						),
						"harga_asli": Math.round(harga),
						"potongan_tingkat": Math.round(0),
						"potongan_diskon": Math.round(
							(findDiskon.harga_jual - hargaSetelahDiskon) * qtySisa
						),
						"min_diskon": findDiskon.min,
						"min_tingkat": "",
						"tipe_promo": "diskon",
						"persen_pajak": persenPajak
					});
				} else {
					const hargaJual = kenaPajak(
						harga,
						statusPajak,
						persenPajak
					);
	
					secondKeranjang.push({
						"id": idProduk,
						"nama": nama,
						"barcode": barcode,
						"qty": qtySisa,
						"qty_asli": qtySisa,
						"harga_jual": Math.round(hargaJual),
						"subtotal_jual": Math.round(hargaJual * qtySisa),
						"harga_modal": Math.round(hargaModal),
						"subtotal_modal": Math.round(subtotalModal),
						"laba": Math.round(
							(harga * qtySisa) - subtotalModal
						),
						"harga_asli": Math.round(harga),
						"potongan_tingkat": Math.round(0),
						"potongan_diskon": Math.round(0),
						"min_diskon": "",
						"min_tingkat": "",
						"tipe_promo": "",
						"persen_pajak": persenPajak
					});
				}
			}
		}
	}

		resetPop();
		this.produk = await getData("produk");
		this.pajak = await getData("pajak");
