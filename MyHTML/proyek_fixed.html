}

class TransaksiCepat {
	constructor() {
		this.produk = null;
		this.pajak = null;
		this.keranjang = [];
		this.secondKeranjang = [];
		this.currentSearchId = 0;
		this.totalBelanja = 0;
		this.kembalian = 0;
		this.persenPajak = 0;
		this.aktifPajak = 0;
		this.noTrans = "";
		this.video = document.getElementById("preview");
		this.status = document.getElementById("status");
		this.animationId = null;
		this.hasilPencarian = [];
	}
	
	async openCamera() {
		await aktifkanScanner();
		this.mulaiScan();
	}
	
	async mulaiScan(){
		if (!("BarcodeDetector" in window)){
			this.status.textContent = "Browser ini tidak mendukung barcode";
			return;
		}
		try {
			const stream = await navigator.mediaDevices.getUserMedia({
				video: { facingMode: "environment" }
			});
			this.video.srcObject = stream;
			await new Promise(resolve => {
			    this.video.onloadedmetadata = resolve;
			});
			this.status.textContent = "Mulai scan...";

		} catch (err) {
			await modalShow(error, err);
			return;
		}
		const detector = new BarcodeDetector({
			formats: ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"]
		});
		
		let hasilTerakhir = null;
		let waktuTerakhir = 0;

		const loop = async () => {
			if (!scanning) return;
			try {
				const barcodes = await detector.detect(this.video);
				if (barcodes.length > 0) {
				    const hasil = barcodes[0].rawValue;
				    const sekarang = Date.now();
				    const sudahLewat = sekarang - waktuTerakhir > 2000;
				
				    if (hasil !== hasilTerakhir || sudahLewat) {
				        hasilTerakhir = hasil;
				        waktuTerakhir = sekarang;
				        this.cari.value = hasil;
				        this.addKeranjang();
				        mainkanBeep();
				    }
				}
			} catch (err) {
				await modalShow(error, err);
			}
			this.animationId = requestAnimationFrame(loop);
		};
		loop();
	}
	
	generateNoTrans() {
		this.noTrans = createNo();
	}
	updateKeranjang() {
		this.badge.textContent = this.secondKeranjang.length;
	}
	async tambahkanSecondKeranjang() {
		try {
			const hasilValidasi = await fetch(url + "tambahkan_second_keranjang", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
					},
					body: JSON.stringify(this.keranjang)
			});
			const result = await hasilValidasi.json()
			this.totalBelanja = result.total
			this.labelTotal.textContent = "Total: " + formatMataUang(result.total);
			this.secondKeranjang = result.data || [];
			this.updateKeranjang();
		} catch (er) {
			await modalShow(error, er);
		}
	}
	async addKeranjang() {
		const barcode = this.cari.value.trim();
		const item = this.produk.find(p => p.barcode === barcode) ?? null;
		if (item) {
			const exist = this.keranjang.find(p => p.barcode === item.barcode) ?? null;
			if (exist) {
				if (exist.qty + 1 > item.jumlah) {
					await modalShow(gagal, "Stok tidak cukup");
					return;
				}
				exist.qty += 1;
			} else {
				if (item.jumlah <= 0){
					await modalShow(gagal, "Stok produk habis");
					return;
				}
				this.keranjang.push({
					id: item.id_produk,
					barcode: item.barcode,
					nama: item.nama,
					qty: 1,
					harga: item.harga_jual
				})
			}
			this.cari.value = "";
			this.tambahkanSecondKeranjang();
		} else {
			await modalShow(gagal, "Produk tidak ditemukan");
		}
	}
	
	async tambahKeranjang(id, qtyValue) {
		if ([NaN, "0", ""].includes(qtyValue)) {
			return;
		}
		const qty = safeInt(qtyValue);
		const find = this.keranjang.find(p => p.id === id) ?? null;
		const prd = this.produk.find(p => p.id_produk === id) ?? null;
		if (find) {
			const totalQty = find.qty + qty;
			if (totalQty > prd.jumlah) {
				await modalShow(gagal, "Stok tidak cukup");
				return;
			}
			find.qty = totalQty;
		} else {
			if (qty > prd.jumlah) {
				await modalShow(gagal, "Stok tidak cukup");
				return;
			}
			this.keranjang.push({
					nama: prd.nama,
					barcode: prd.barcode,
					qty: qty,
					harga: prd.harga_jual,
					id: prd.id_produk
			})
		}
		this.tambahkanSecondKeranjang();
	}
	
	async cariProduk(teks="") {
		const searchId = ++this.currentSearchId;
		this.hasilPencarian.length = 0;
		for (const item of this.produk) {
			if (searchId !== this.currentSearchId) return;
			if (
				item.nama.toLowerCase().includes(teks.toLowerCase()) ||
				item.kategori.toLowerCase().includes(teks.toLowerCase()) ||
				item.barcode.includes(teks) ||
				item.id_produk.includes(teks)
			) {
				this.hasilPencarian.push(item);
			}
		}
		this.tampilkanProduk();
	}
	
	tampilkanProduk() {
		this.frBawah.innerHTML = "";
		for (const item of this.hasilPencarian.slice(0,10)) {
			const fr = pembuatField(this.frBawah, item.nama);
			fr.appendChild(makeLabel("🏷️ " + item.barcode), "biasa");
			fr.appendChild(makeLabel("🆔 " + item.id_produk), "biasa");
			fr.appendChild(makeLabel("Jumlah stok: " + formatUnit(item.jumlah, item.satuan_jual), "biasa"));
			fr.appendChild(makeLabel("Harga jual: " + formatMataUang(addPajak(item.harga_jual, this.aktifPajak, this.persenPajak)), "biasa"));
			const qty = makeEntry("Masukkan jumlah", "number");
			qty.id = "qty-inp";
			fr.appendChild(qty);
			fr.appendChild(makeButton("btn", "Tambah", () => this.tambahKeranjang(item.id_produk, safeInt(qty.value.trim()))));
		}
	}

	async hapusProduk(id) {
		this.keranjang = this.keranjang.filter(p => p.id !== id);
		await this.tambahkanSecondKeranjang();
		this.lihatKeranjang();
	}
	async selesaikanTransaksi(input) {
		const result = Object.fromEntries(Object.entries(input).map(([key, val]) => [key, val.value.trim()]));
		let bayar = 0;
		if (result["jumlah bayar"] !== "") {
			bayar = safeFloat(result["jumlah bayar"]);
		}
		if (bayar < this.totalBelanja) {
			await modalShow(gagal, "Pembayaran tidak cukup");
			return;
		}
		const namaPembeli = result.nama;
		const kontak = result["nomor telepon"];
		const pembeli = namaPembeli + " " + kontak;
		const data = {
			items: this.secondKeranjang,
			total: safeFloat(this.totalBelanja),
			bayar: safeFloat(bayar),
			kembali: safeFloat(this.kembalian),
			sumber: String(idDevice),
			operator: String(user),
			no_trans: this.noTrans,
			pembeli: pembeli
		}
		if (await modalShow(confirm, "Data telah siap. Selesaikan transaksi sekarang?")) {
			const up = await postData("penjualan_campuran", data);
			if (up) {
				if (await modalShow((up.stat.toLowerCase() === "berhasil" ? berhasil : gagal), up.pesan, false)) {
					await cetakStruk(data);
					this.resetTrx();
				} else {
					this.resetTrx();
				}
			} else {
				await modalShow(gagal, pesanGagal);
			}
		}
	}
	resetTrx() {
		this.secondKeranjang.length = 0;
		this.keranjang.length = 0;
		this.totalBelanja = 0;
		this.labelTotal.textContent = "Total: " + formatMataUang(this.totalBelanja);
		this.setup();
	}
	lihatKeranjang() {
		this.frBawah.innerHTML = "";
		const fr = makeParent("container");
		
		this.frBawah.appendChild(fr);
		for (const item of this.secondKeranjang) {
			const frame = pembuatField(fr, item.nama);
			const p = makeParent("container");
			p.style.display = "grid";
			p.style.gridTemplateColumns = "repeat(3,1fr)";
			
			for (const [key, val] of [
				["Qty", formatUnit(item.qty, "unit")],
				["Harga jual", formatMataUang(item.harga_jual)],
				["Subtotal", formatMataUang(item.subtotal_jual)]
			]) {
				for (const i of [
					makeLabel(key, "biasa"),
					makeLabel(":", "biasa"),
					makeLabel(val, "biasa")
				]) p.appendChild(i);	
			}
			frame.appendChild(p);
			frame.appendChild(makeButton("btn", "Hapus", () => this.hapusProduk(item.id), "Pictures/hapus.png"));
		}
	
		const co = pembuatField(this.frBawah, "Checkout");
		const ent = pembuatEntry(co, [
				["jumlah bayar", "Jumlah bayar", "number"],
				["nama", "Nama pembeli", "text"],
				["nomor telepon", "Nomor telepon", "number"]
		])
		ent["jumlah bayar"].oninput = () => this.hitungKembalian(ent["jumlah bayar"].value.trim())
		co.appendChild(makeButton("btn", "Selesai", () => this.selesaikanTransaksi(ent)));
	}
	hitungKembalian(bayar) {
		let jumlahBayar = 0;
		if (bayar !== "") {
			jumlahBayar = safeFloat(bayar);
		}
		this.kembalian = jumlahBayar - this.totalBelanja;
		this.labelTotal.textContent = "Kembali: " + formatMataUang(this.kembalian);
	}
	prepareFrames() {
		this.labelTotal = document.getElementById("jdl");
		this.labelTotal.textContent = "Total: " + formatMataUang(this.totalBelanja);

		const atas = makeParent("container-horizontal");
		this.cari = makeEntry("Cari produk", "text");
		this.cari.oninput = () => this.cariProduk(this.cari.value.trim());
				
		const btnKeranjang = makeButton("btn btn-cancel", "", () => this.lihatKeranjang(), "Pictures/checkout.png");
		this.badge = document.createElement("label");
		this.badge.className = "badge";
		this.badge.textContent = this.keranjang.length;
		btnKeranjang.appendChild(this.badge);
		const btnScanner = makeButton("btns", "", () => this.openCamera(), "Pictures/barcode.png");
		const btnMedia = makeButton("btns", "", () => mediaPembayaran(), "Pictures/banknotes.png");
		for (const item of [this.cari, btnKeranjang, btnScanner, btnMedia]) {
			atas.appendChild(item);
		}
		this.tengah.appendChild(atas);
		this.frBawah = makeParent("frame");
		this.tengah.appendChild(this.frBawah);
		
		this.cari.addEventListener("keydown", (e) => {
			if (e.key === "Enter") {
				const t = this.cari.value.trim();
				const isBarcode = this.mapProduk[t];
				if (isBarcode) {
					this.tambahKeranjang(isBarcode.id_produk, 1);
				} else {
					const inps = this.frBawah.querySelectorAll("#qty-inp");
					if (inps.length) {
						inps[0].focus();
						inps.forEach((item, i) => {
							item.addEventListener("keydown", (e) => {
								if (e.key === "Enter") {
									if ( i >= (inps.length - 1)) {
										this.cari.focus();
										return;
									}
									inps[i+1].focus();
								}
							});
						});
					}
				}
			}
		});
	}
	
	async setup() {
		this.produk = await getData("produk");
		this.pajak = await getData("pajak");
		this.tengah = document.querySelector(".tengah");
		this.tengah.innerHTML = "";
		if (this.pajak) {
			this.persenPajak = this.pajak[0].persen;
			this.aktifPajak = this.pajak[0].aktif;
		}
		this.mapProduk = Object.fromEntries(this.produk.map(p => [p.barcode, p]));
		this.generateNoTrans();
		this.prepareFrames();
	}
}

	async tambahKeranjangRetur(qty, item) {
		const q = safeInt(qty.value.trim());
		if (q <= 0) return;

		const itemRetur = this.keranjangRetur.find(a => a.id === item.id) ?? null;
		const sudahAda = itemRetur ? itemRetur.jumlah : 0;
		const qtyTotal = sudahAda + q;
		if (qtyTotal > item.qty_asli) return;
		const qtySisa = item.qty_asli - qtyTotal;
		let subtotalRetur = 0;
		let tipePromo = (item.tipe_promo || "").toLowerCase();
		if (tipePromo === "diskon") {
			let batal = 0;
			if (qtySisa < (item.min_diskon || 0)) {
				batal = (item.potongan_diskon || 0) / item.qty_asli * qtySisa;
			} subtotalRetur = qtyTotal * item.harga_jual - batal;
		} else if (tipePromo === "tingkat") {
			let batal = 0;
			if (qtySisa < (item.min_tingkat || 0)) {
				batal = (item.potongan_tingkat || 0) / item.qty_asli * qtySisa;
			}
			const kotor = item.harga_jual / item.qty_asli * qtyTotal;
			subtotalRetur = kotor - batal;
		} else { subtotalRetur = qtyTotal * item.harga_jual; }
		
		if (subtotalRetur > 0) {
			if (itemRetur) {
				itemRetur.jumlah = qtyTotal
				itemRetur.subtotal = subtotalRetur	
			} else {
				this.keranjangRetur.push({
					id: item.id,
					nama: item.nama,
					jumlah: qtyTotal,
					subtotal: subtotalRetur
				})
			}
			this.totalRetur = this.keranjangRetur.reduce((sum, a) => sum + a.subtotal, 0);
			this.badgeRetur.textContent = this.keranjangRetur.length.toString();
		}
	}

	async selesaikanRetur(alasan) {

	async ringkasanTransaksi(periode) {
		resetJudul("Ringkasan transaksi");
		this.prt.innerHTML = "";
		const parent = makeParent("frame");
		this.prt.appendChild(parent);

		const dataHasil = await getDt(`get_data_sold_out_today/${periode}`);
		if (dataHasil) {
			const data = {
				jumlah_transaksi: dataHasil.jumlah,
				terjual: dataHasil.terjual,
				total: dataHasil.total,
				laba: dataHasil.laba,
				data: dataHasil.data
			}
			const pr1 = pembuatField(parent, `Informasi penjualan ${periode.replace(/_/g, " ")}`);
			pr1.style.display = "grid";
			pr1.style.gridTemplateColumns = "repeat(3,1fr)";
			for (const [key, value] of Object.entries(data)) {
				if (key.toLowerCase() !== "data") {
					const lbla = makeLabel(capitalize(key.replace(/_/g, " ")), "biasa");
					const titik = makeLabel(":", "biasa");
					let val = formatMataUang(value);
					if (key.toLowerCase() === "terjual") {
						val = formatUnit(value, "unit");
					} else if (key.toLowerCase() === "jumlah_transaksi") {
						val = formatUnit(value, "kali transaksi");
					}
					const lblb = makeLabel(val, "biasa");
					for (const item of [lbla, titik, lblb]) {
						pr1.appendChild(item);
					}
				}
			}
			grafikMaker(
				parent,
				`PENJUALAN ${periode.replace(/_/g, " ").toUpperCase()}`,
				"Pemasukan dan keuntungan",
				["Pemasukan", "Keuntungan"],
				"Laporan penjualan",
				[data.total, data.laba]
			)
			grafikMaker(
				parent,
				`PENJUALAN ${periode.replace(/_/g, " ").toUpperCase()}`,
				"Produk terjual dan jumlah transaksi",
				["Produk terjual", "Jumlah transaksi"],
				"Laporan jumlah transaksi",
				[data.terjual, data.jumlah_transaksi]
			)
			const tabel = makeTable(`
					<tr>
						<th>Id produk</th>
						<th>Nama produk</th>
						<th>Terjual</th>
						<th>Pemasukan</th>
						<th>Keuntungan</th>
					</tr>
				`)
			for (const item of data.data) {
				const tr = document.createElement("tr");
				tr.innerHTML = `
						<td>${item.id_produk}</td>
						<td>${item.nama}</td>
						<td>${item.terjual}</td>
						<td>${formatMataUang(item.total)}</td>
						<td>${formatMataUang(item.laba)}</td>
					`
				tabel.appendChild(tr);
			}
			this.prt.appendChild(tabel)
		}
	}

		this.tengah.innerHTML = "";

					}

	async hapusTrx(no) {
		if (await modalShow("Konfirmasi", "Hapus transaksi " + no + "?", false)) {
			const info = {
				tabel: "cadangan_keranjang",
				key: "no",
				data: [no]
			}
			const hasil = await postDataKedua("hapus_serbaguna", info)
			await message(hasil)
		}
	}

	async selesaikanTransaksi(no) {
		const data = this.cadang.find(p => p.no === no) ?? null;
		if (data.status.toLowerCase() !== "belum lunas") {
			await modalShow("Gagal", "Transaksi ini telah dilunasi");
			return;
		}
		infoCadangan = data;
		transaksi.setup();
	}

	setTengah() {
		this.tengah.innerHTML = "";
		const btnFr = makeParent("container-horizontal");
		pembuatButton(btnFr, [
				["btn", "Hari ini", () => this.ringkasanTransaksi("hari_ini")],
				["btn", "Minggu ini", () => this.ringkasanTransaksi("minggu_ini")],
				["btn", "Bulan ini", () => this.ringkasanTransaksi("bulan_ini")]
		])

		this.prt = makeParent("container");
		for (const fr of [btnFr, this.prt]) {
			this.tengah.appendChild(fr);
		}
	}
	setup() {
		this.tengah = document.querySelector("#tgh");
		this.tengah.innerHTML = "";
		this.setTengah();
		this.ringkasanTransaksi("hari_ini");
	}
}

	async riwayatAktivitas() {
		resetJudul("Riwayat aktivitas");
		this.sudahMuat = 0;
		this.perMuat = 100;
		
		this.tengah.innerHTML = "";
		const atas = makeParent("container");
		atas.style.display = "grid";
		atas.style.gridTemplateColumns = "repeat(3,1fr)";
		const bawah = makeParent("container");
		const filterPeriode = pembuatCombo(atas, "Hari ini", ["Minggu ini", "Bulan ini", "Semua periode"]);
		const filterOperator = pembuatCombo(atas, "Semua operator", [...new Set(this.pengguna.map(p => p.nama))]);
		const filterTanggal = document.createElement("input");
		filterTanggal.type = "date";
		filterTanggal.className = "entry";
		filterTanggal.value = new Date().toISOString().split('T')[0];
		atas.appendChild(filterTanggal);
		atas.appendChild(makeButton("btn", "Ambil data", () => this.getDataAktivitas(bawah, filterPeriode, filterOperator)));
		atas.appendChild(makeButton("btn btn-cancel", "Filter tanggal", () => this.getDataTanggal(bawah, filterTanggal, filterOperator)));
		const b = makeButton("btn", "Lainnya »", () => this.tampilkanAktivitas(bawah));
		b.style.background = "transparent";
		b.style.color = "black";
		b.style.boxShadow = "none";
		for (const item of [atas, bawah, b]) this.tengah.appendChild(item);
		this.getDataAktivitas(bawah, filterPeriode, filterOperator);
	}
	
	async getDataTanggal(p, tanggal, opr) {
		p.innerHTML = "";
		const tgl = tanggal.value;
		const op = opr.value;
		const dataFilter = {
			tanggal: tgl,
			operator: op
		}
		const data = await getDt("filter_aktivitas/" + JSON.stringify(dataFilter));
		this.aktivitas = data;
		this.sudahMuat = 0;
		this.tampilkanAktivitas(p);
	}
	
	async getDataAktivitas(p, periode, opr) {
		p.innerHTML = "";
		const prd = periode.value, oper = opr.value;
		const dataFilter = { periode: prd, operator: oper }
		const data = await getDt("filter_aktivitas_periode/" + JSON.stringify(dataFilter));
		this.aktivitas = data;
		this.sudahMuat = 0;
		this.tampilkanAktivitas(p);
	}
	
	tampilkanAktivitas(p) {
		if (!this.aktivitas.length) { p.appendChild(makeLabel("Data tidak tersedia", "jdl")); return; }
		if (this.sudahMuat >= this.aktivitas.length) return;
		p.innerHTML = "";
		if (!this.aktivitas.length) { p.appendChild(makeLabel("Data kosong", "jdl")); return; }
		const forTampil = this.aktivitas.slice(this.sudahMuat, this.sudahMuat + this.perMuat);
		
		const tabel = makeTable(`
			<tr>
				<th>Waktu</th>
				<th>Aksi</th>
				<th>Operator</th>
				<th>Sumber</th>
			</tr>
		`);
		p.appendChild(tabel);
		for (const i of forTampil) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${i.waktu}</td>
				<td>${i.aksi}</td>
				<td>${i.operator}</td>
				<td>${i.sumber}</td>
			`;
			tr.onclick = (e) => {
				const parent = makeParent("dropdown-overlay");
				parent.style.display = "flex";
				parent.style.flexDirection = "column";
				parent.style.top = `${e.pageY}px`;
				parent.style.left = `${e.pageX}px`;

class Lainnya {
	async putar(judul, tipe, simpanan) {
		const wadah = document.querySelector(".file-field");
		wadah.classList.remove("hidden");
		wadah.innerHTML = "";
		const pemutar = document.createElement(tipe);
		const jdl = makeLabel(judul, "biasa");
		jdl.style.color = primarySoft;
		
		const badge = makeLabel("x", "badge");
		badge.style.right = "10px";
		badge.style.top = "10px";
		
		badge.onclick = () => {
			pemutar.pause();
			wadah.classList.add("hidden");
		}
		pemutar.controls = true;
		pemutar.src = await ambil_tipe_file(judul);
		pemutar.play();
	
		pemutar.addEventListener("ended", async () => {
			const index = simpanan.indexOf(judul);
			if (index === -1) return;			
			const source = simpanan[(index + 1) % simpanan.length];			
			pemutar.src = await ambil_tipe_file(source);
			jdl.textContent = source;
			pemutar.play();
		});
		for (const it of [badge, jdl, pemutar]) {
			wadah.appendChild(it);
		}
	}

class Laporan {
	constructor() {
		this.tengah = document.querySelector(".tengah");
		this.user = null;
		this.riwayat = null;
		this.produk = null;
		this.info = {
			"Total penjualan": 0,
			"Total laba": 0,
			"Kena pajak": 0,
			"Pemasukan": 0,
			"Harga pokok penjualan": 0,
			"Terjual": 0,
			"Potongan diskon": 0,
			"Potongan tingkat": 0
		}
		this.produkTerjual = [];
	}

	tampilkan() {
		this.tgh.innerHTML = "";
		const field = pembuatField(this.tgh, "Informasi umum");
		const atas = makeParent("container");
		atas.style.display = "grid";
		atas.style.gridTemplateColumns = "repeat(3,1fr)";
		const tabel = makeTable(`
			<tr>
				<th>Id</th>
				<th>Nama</th>
				<th>Terjual</th>
				<th>Total</th>
				<th>Laba</th>
			</tr>
		`)
		for (const [key, value] of Object.entries(this.info)) {
			const keyLabel = makeLabel(key, "biasa");
			const titik = makeLabel(":", "biasa");
			let valueNilai = formatMataUang(Math.round(value));
			if (key.toLowerCase() === "terjual") {
				valueNilai = formatUnit(value, "unit");
			} else if (["total penjualan", "total laba"].includes(key.toLowerCase())) {
				valueNilai = formatMataUang(Math.round(value)) + " /termasuk pajak";
			}
			const val = makeLabel(valueNilai, "biasa");
			for (const item of [keyLabel, titik, val]) {
				atas.appendChild(item);
			}
		}

		for (const teks of this.produkTerjual.sort((a,b) => b.terjual - a.terjual)) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${teks.id}</td>
				<td>${teks.nama}</td>
				<td>${formatUnit(teks.terjual, "unit")}</td>
				<td>${formatMataUang(teks.total)}</td>
				<td>${formatMataUang(teks.laba)}</td>
			`
			tabel.appendChild(tr);
		}
		field.appendChild(atas);
		this.tgh.appendChild(tabel);
	}

	async filterData() {
		for (const key of Object.keys(this.info)) {
			this.info[key] = 0;
		}
		this.produkTerjual.length = 0;
		const prd = this.periode.value.toLowerCase();
		const opr = this.operator.value.toLowerCase();
		const data = {
			opr: opr,
			prd: prd
		}
		const encoded = encodeURIComponent(JSON.stringify(data));
		const filtered = await getDt("filter_riwayat_penjualan/" + encoded);
		if (filtered) {
			for (const x of filtered) {
				this.info["Total penjualan"] += x.total;
				this.info["Total laba"] += x.total_laba;
				this.info["Kena pajak"] += x.kena_pajak;
				const krj = JSON.parse(x.data_belanja);
				for (const item of krj) {
					this.info["Pemasukan"] += item.subtotal_jual;
					this.info["Harga pokok penjualan"] += item.subtotal_modal;
					this.info["Terjual"] += item.qty_asli;
					this.info["Potongan diskon"] += item.potongan_diskon;
					this.info["Potongan tingkat"] += item.potongan_tingkat;
					const find = this.produkTerjual.find(p => p.id === item.id) ?? null;
					if (find) {
						find["terjual"] += item.qty_asli;
						find["total"] += item.subtotal_jual;
						find["laba"] += item.laba;
					} else {
						this.produkTerjual.push({
								id: item.id,
								nama: item.nama,
								terjual: item.qty_asli,
								total: item.subtotal_jual,
								laba: item.laba
						})
					}
				}
			}
			this.tampilkan();
		}
	}

	laporanPenjualanProduk() {
		this.tengah.innerHTML = "";
		const atas = makeParent("container-horizontal");
		atas.style.flexWrap = "nowrap";
		this.tgh = makeParent("container");
		for (const x of [atas, this.tgh]) {
			this.tengah.appendChild(x);
		}

		this.periode = pembuatCombo(atas, "Semua periode", ["Hari ini", "Minggu ini", "Bulan ini"]);
		this.operator = pembuatCombo(atas, "Semua operator", [...new Set(this.user.map(p => p.nama))]);
		this.opsi = pembuatCombo(atas, "Pilih daftar laporan", ["Laporan produk kategori", "Laporan operator"]);
		for (const x of [this.periode, this.operator]) {
			x.onchange = () => this.filterData();
		}
		this.opsi.onchange = () => this.opsiPilih();
		this.filterData();
	}

	laporanProdukKategori() {
		this.tgh.innerHTML = "";
		const map = Object.fromEntries(this.produk.map(p => [p.id_produk, p.kategori]));
		let for_show = [];
		for (const item of this.produkTerjual) {
			const kategori = map[item.id] || "";
			const find = for_show.find(p => p.kategori.toLowerCase() === kategori.toLowerCase()) ?? null;
			if (find) {
				find.terjual += item.terjual;
				find.total += item.total;
				find.laba += item.laba;
			} else {
				for_show.push({
						kategori: kategori,
						terjual: item.terjual,
						total: item.total,
						laba: item.laba
				})
			}
		}

		const header = `
			<tr>
				<th>Kategori</th>
				<th>Terjual</th>
				<th>Total</th>
				<th>Total keuntungan</th>
			</tr>
		`;
		const tabel = makeTable(header);

			const tr = document.createElement("tr");

				<td>${item.kategori}</td>

			this.tgh,

	laporanOperator() {
		this.tgh.innerHTML = "";
		const data = []
		for (const item of this.riwayat) {
			const nama = item.operator;
			const find = data.find(p => p.nama.toLowerCase() === nama.toLowerCase()) ?? null;
			if (find) {
				const kumpul = find.data || [];
				kumpul.push(item);
			} else {
				data.push({
						nama: nama,
						data: [item]
				})
			}
		}

		const dataHasil = [];
		for (const p of data) {
			const dataOpr = p.data || [];
			const total = dataOpr.reduce((sum,a) => sum + a.total, 0);
			const laba = dataOpr.reduce((sum, a) => sum + a.total_laba, 0);
			let qty = 0;
			for (const item of dataOpr) {
				const dataBelanja = JSON.parse(item.data_belanja);
				for (const i of dataBelanja) {
					qty += i.qty_asli;
				}
			}
			const find = dataHasil.find(q => q.nama.toLowerCase() === p.nama.toLowerCase()) ?? null;
			if (find) {
				find.terjual += qty;
				find.total += total;
				find.laba += laba;
			} else {
				dataHasil.push({
						nama: p.nama,
						terjual: qty,
						total: total,
						laba: laba
				})
			}
		}
		const tabel = makeTable(`
			<tr>
				<th>Nama</th>
				<th>Terjual</th>
				<th>Total pemasukan</th>
				<th>Total keuntungan</th>
			</tr>	
		`);
		this.tgh.appendChild(tabel);
		for (const item of dataHasil) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.nama}</td>
				<td>${formatUnit(item.terjual, "unit")}</td>
				<td>${formatMataUang(item.total)}</td>
				<td>${formatMataUang(item.laba)}</td>
			`;
			tabel.appendChild(tr);
		}
		const opr_terjual = [...dataHasil].sort((a,b) => b.terjual - a.terjual);
		const opr_total = [...dataHasil].sort((a,b) => b.total - a.total);
		const opr_laba = [...dataHasil].sort((a,b) => b.laba - a.laba);

		grafikMaker(
			this.tgh,
			"Grafik operator dengan kontribusi penjualan terbanyak",
			"Operator dan total penjualan",
			opr_terjual.map(p => p.nama),
			"Total terjual",
			opr_terjual.map(p => p.terjual)
		);

		grafikMaker(
			this.tgh,
			"Grafik operator dengan kontribusi pemasukan terbanyak",
			"Operator dan total pemasukan",
			opr_total.map(p => p.nama),
			"Total pemasukan",
			opr_total.map(p => p.total)
		);

		grafikMaker(
			this.tgh,
			"Grafik operator dengan kontribusi keuntungan terbanyak",
			"Operator dan total keuntungan",
			opr_laba.map(p => p.nama),
			"Total keuntungan",
			opr_laba.map(p => p.laba)
		);

	}

		this.result = data.data;
		this.showUp();
	}
	async getAllFiles(){
		const data = await getDt("multi_endp/file");
		this.result = data.data;
		this.showUp();
	}
	async getAllFolders(){
		const data = await getDt("multi_endp/folder");
		this.result = data.data;
		this.showUp();
	}
	
	showUp() {
		let str = "";
		const rst = JSON.parse(this.result);
		Object.keys(rst).forEach((key, i) => {
			str += `${i+1}. ${key}\n`;
		});
		mainkanBeep();
		this.qad.data.value = str;
	}
	
	async submitCommand(qad){
		const q = qad.query.value.trim();
		const d = qad.data.value.trim();
		if (!q) return;
		if (q.startsWith(".")) {
			const teks = q.replace(/^\./, "").toLowerCase();
			const bagi = teks.split(" ");
			if (bagi.length > 1) {
				const satu = bagi[0];
				const dua = bagi[1];
				this.map[satu][dua]();
			} else {
				this.qad.data.value = "Unknown command";
			}
		} else if (q.startsWith("//")) {
			const cmd = q.replace("//","").split(" ");
			const real = cmd[0];
			const value = cmd.slice(1).join(" ");
			this.map[real](value);
			
		} else {
			const dataHasil = {
				query: q,
				data: d
			}
			const hasil = await postDataKedua("query_handler", dataHasil);
			if (hasil){
				qad.data.value = hasil.pesan;
			}
		}
	}
	
	async open(val){
		const path = JSON.parse(this.result)[val];
		const url = `open_file?path=${encodeURIComponent(path)}`;
		if ([".jpeg", ".jpg", ".png", ".gif"].some(ext => path.endsWith(ext))){
			makeWindow();
			const parent = document.querySelector(".lc-content");
			parent.innerHTML = "";
			const img = document.createElement("img");
			img.className = "image";
			img.src = url;
			parent.appendChild(img);
		} else {
			const hasil = await getDt(url);
			this.qad.data.value = hasil.hasil || "Terjadi kesalahan";
		}
	}
	
	async deleteF(val){
		const path = JSON.parse(this.result)[val];
		const url = `delete_file?path=${encodeURIComponent(path)}`;
		const hasil = await getDt(url);
		this.qad.data.value = hasil.hasil || "Terjadi kesalahan";
	}
	
	setup() {
		//if (kunciKiri) return;
		this.map = {
			all: {
				paths: this.getAllPaths.bind(this),
				files: this.getAllFiles.bind(this),
				folders: this.getAllFolders.bind(this)
			},
			open: this.open.bind(this),
			"delete": this.deleteF.bind(this)
		}
		this.tengah = document.querySelector(".tengah");
		this.tengah.innerHTML = "";
		
		const parent = makeParent("container");
		parent.style.background = kiriBg;
		this.tengah.appendChild(parent);
			
		const warning = makeButton("invisible-btn", "Hati-hati saat menulis query.", null, "Pictures/danger.png");
		warning.style.color = "white";
		parent.appendChild(warning);
			
		this.qad = pembuatTextArea(parent, [
			["query", "Tulis query Anda disini...", ""],
			["data", "Tulis data Anda disini...", ""]
		]);
		const cont = makeParent("container-horizontal");
		cont.style.overflow = "auto";
		cont.style.background = "transparent";
		cont.style.border = "none";
		parent.appendChild(cont);
		pembuatButtonGambar(cont, [
			["btn", "Submit", () => this.submitCommand(this.qad), null],
			["btns", "Query umum", () => this.commonQuery(), "Pictures/edit.png"],

		});
	}
}

class HakAkses {
	constructor() {
		this.hak = null;
		this.user = null;
	}
	
	pembuatCek(parent, judul, data) {
		const p = pembuatField(parent, judul);
		p.style.background = "transparent";
		let dataReturn = {};
		for (const key of data) {
			const cek = makeCekbox(p, capitalize(key));
			dataReturn[key] = cek;
		}
		return dataReturn;
	}
	
	prepareFrames() {
		this.tengah.innerHTML = "";
		const atas = makeParent("container-horizontal");
		const status = [...new Set(this.user.map(p => p.status))];
		const forShow = status.slice(1, status.length);
		this.statusUser = pembuatCombo(atas, "- Pilih satu -", status);
		this.cekSemua = makeCekbox(atas, "Cek semua");
		atas.appendChild(makeButton("btn", "Simpan", () => this.simpanIzin()));
		
		this.bawah = makeParent("frame");
		for (const a of [atas, this.bawah]) this.tengah.appendChild(a);
	}
	
	addCek() {
		this.operasional = this.pembuatCek(this.bawah, "Operasional", [
			"akun", "produk", "pajak", "mitra", "beban"
		]);
		this.transaksi = this.pembuatCek(this.bawah, "Transaksi", [
			"rekap", "mobile", "desktop", "cadangan", "retur transaksi", "offline"
		]);
		this.riwayat = this.pembuatCek(this.bawah, "Riwayat", [
			"riwayat penjualan", "aktivitas", 'riwayat retur', 'riwayat keuangan', 'login'
		]);
		this.laporan = this.pembuatCek(this.bawah, "Laporan", [
			'laporan penjualan', 'laporan keuangan', 'lainnya'
		]);
		this.lainnya = this.pembuatCek(this.bawah, "Lainnya", [
			'hiburan', 'backup', 'hak akses'
		]);
	}
	
	async simpanIzin() {
		const status = this.statusUser.value;
		const operasional = Object.fromEntries(Object.entries(this.operasional)
			.map(([key, value]) => [key, value.checked]
		));
		const transaksi = Object.fromEntries(Object.entries(this.transaksi)
			.map(([key, value]) => [key, value.checked]
		));
		const riwayat = Object.fromEntries(Object.entries(this.riwayat)
			.map(([key, value]) => [key, value.checked]
		));
		const laporan = Object.fromEntries(Object.entries(this.laporan)
			.map(([key, value]) => [key, value.checked]
		));
		const lainnya = Object.fromEntries(Object.entries(this.lainnya)
			.map(([key, value]) => [key, value.checked]
		));
		const hasil = {
			...operasional,
			...transaksi,
			...riwayat,
			...laporan,
			...lainnya
		}
		let dataHasil = [];
		for (const [key, value] of Object.entries(hasil)) {
			if (value === true) dataHasil.push(key);
		}
		if (!dataHasil.length) {
			await modalShow(gagal, "Anda tidak menambahkan centang fitur apapun");
			return;
		}
		const data = {
			status: status,
			izin: JSON.stringify(dataHasil)
		}
		if (await modalShow(confirm, `Data telah siap. Simpan hak izin akses ${status} sekarang?`)) {
			const up = await postDataKedua("atur_izin_akses", data);
			await message(up);
			this.setup();
		}
	}
	
	cekSemuaIzin() {
		const izin = this.cekSemua.checked;
		const aliansi = {
			...this.operasional,
			...this.transaksi,
			...this.riwayat,
			...this.laporan,
			...this.lainnya
		}
		Object.values(aliansi).forEach(item => {
			item.checked = izin;
		});
	}
	
	showIzin() {
		const stat = this.statusUser.value.toLowerCase();
		const izin = this.hak.find(p => p.status.toLowerCase() === stat.toLowerCase()) ?? null;
		const izinAkses = izin ? JSON.parse(izin.izin ?? []) : [];
		const aliansi = {
			...this.operasional,
			...this.transaksi,
			...this.riwayat,
			...this.laporan,
			...this.lainnya
		}
		for (const val of Object.values(aliansi)) val.checked = false;
		for (const item of izinAkses) {
			aliansi[item].checked = true;
		}
	}
	
	async setup() {
		resetJudul("Hak akses");
		this.hak = await getData("hak_akses");
		this.user = await getData("users");
		this.tengah = document.querySelector(".tengah");
		this.prepareFrames();
		this.addCek();
		this.cekSemua.onchange = () => this.cekSemuaIzin();
		this.statusUser.onchange = () => this.showIzin();
		this.showIzin();
	}
}

		if (["pulsa-reguler", "pulsa-transfer"].includes(i)) {
			this.kelolaPulsa(item);
		} else if (item.toLowerCase() === "pulsa-internasional") {
			this.pulsaInternasional();
		} else if (["paket-internet", "paket-telepon"].includes(i)) {
			this.kelolaPaket(item);
		} else if (item.toLowerCase() === "token-pln") {
			this.kelolaTokenListrik();

			this.firstShow("brand", "nomor tujuan", "Masukkan nomor E-wallet tujuan...", "number", 2, "saldo e-money");
		} else if (item.toLowerCase() === "streaming-tv") {
			this.firstShow("brand", "nomor serial/id", "Masukkan nomor tujuan...", "text", 1, "streaming & tv");
		} else if (item.toLowerCase() === "paket-lainnya") {
			this.firstShow("brand", "nomor tujuan", "Masukkan nomor tujuan...", "text", 1, "paket lainnya");
		}

	tunjukkanData(
		parent,
		combo,
		nomor,
		separator,
		tambahan
	) {
		
		parent.innerHTML = "";
		if (!nomor.length) {
			const lbl = makeLabel("Nomor tidak valid", "biasa");
			lbl.style.color = "red";
			p.appendChild(lbl);
			return;
		}
		const filter = this.dataFilter.filter(pr => pr[separator].toLowerCase() === combo.toLowerCase());
		for (const item of filter) {
			const btn = this.makeBt(parent);
			if (item.status.toLowerCase() !== "available")
				btn.style.border = "2px solid red";
			for (const i of [
				makeLabel(item.name, "teks"),
				makeLabel(`Kode: ${item.code}`, "teks"),
				makeLabel(`Harga: ${formatMataUang(item.price.basic)}`, "teks"),
				makeLabel(`Status: ${item.status.toLowerCase() === "available" ? "Tersedia" : "Habis"}`, "teks")
			]) btn.appendChild(i);
			btn.onclick = () => this.konfirmasiPesanan(nomor, item.code, item.name, item.status, item.price.basic, item.note, tambahan);
		}
	}

		const p = pembuatJendela();
		const parent = pembuatField(p, judul);
		const evil = [...new Set(this.dataFilter.map(p => p[aspek]))];
		const num = pembuatEntry(parent, [[key, placeholder, tipe]]);
		const combo = pembuatCombo(parent, "- Pilih satu -", evil);
		const prt = this.makePr(parent, val)
		combo.onchange = () => this.tunjukkanData(prt, combo.value, num[key].value.trim(), aspek, combo.value);
	}

	//bagian paket//	
	kelolaPaket(tipe) {
		const p = pembuatJendela();
		const parent = pembuatField(p, tipe.replaceAll("-", " "));
		
		if (tipe.toLowerCase() === "paket-internet") {
			const info = pembuatField(parent, "informasi");
			info.appendChild(makeLabel("Paket internet Telkomsel rata-rata mendapatkan kuota tergantung zona", "biasa"));
			info.appendChild(makeLabel("Paket internet Indosat jika gagal 2x harap UNREG paket sebelumnya / hubungi admin", "biasa"));
		}

class Kalkulator {
	setup() {
		const parent = pembuatJendela();
		const jdl = makeLabel("Kalkulator", "jdl");
		const pr = makeParent("container");
		pr.style.background = kiriBg;
		for (const i of [jdl, pr]) parent.appendChild(i);
		this.input = document.createElement("textarea");
		this.input.className = "entry";
		this.input.rows = "2";
		const btnFrame = makeParent("container");
		btnFrame.style.display = "grid";
		btnFrame.style.gridTemplateColumns = "repeat(4,1fr)";
		for (const i of [this.input, btnFrame]) pr.appendChild(i);
		
		const btns = [
		  "AC", "÷", "×", "←",
		  "7", "8", "9", "–",
		  "4", "5", "6", "+",
		  "1", "2", "3", ",",
		  "0", "(", ")", "%",
		  "="
		];
		const colorMap = {
			"AC": "red",
			"=": "green",
			"←": "yellow"
		}
		
		for (const teks of btns) {
			const btn = makeButton("btn", teks, null);
			btn.style.fontSize = "1.15rem";
			btn.style.transition = "none";
			btn.style.fontWeight = "550";
			btn.style.background = colorMap[teks];
			if (teks === "=") btn.style.gridColumn = "1/-1";
			if (teks === "←") btn.style.color = "black";
			btnFrame.appendChild(btn);
			btn.addEventListener("pointerdown", (e) => {
				e.preventDefault();
				this.give(teks);
			});
		}
		this.input.addEventListener("keydown", (e) => {
			if (e.key === "Enter") {
				e.preventDefault();
				this.showResult();
			} else {
				const val = this.input.value.trim();
				if (val.includes("\n")) {
					const p = val.split("\n");
					this.input.value = p.at(-1);
				}
			}
		});
	}
	
	showResult() {
		try {
			const inp = this.input.value.trim()
				.replaceAll("÷","/")
				.replaceAll("×","*")
				.replaceAll("–","-")
				.replaceAll(",",".")
				.replaceAll("%","/100");
			const hasil = stringMath(inp);
			this.input.value += "\n" + hasil;
			this.sudahHitung = true;
		} catch (err) {
			this.input.value = err.message;
		}
	}
	
	give(teks) {
		const el = this.input;
		if (teks === "AC") {
			el.value = "";
			this.sudahHitung = false;
		} else if (teks === "←") {
			el.value = el.value.slice(0, -1);
		} else if (teks === "=") {
			this.showResult();
		} else {
			if (this.sudahHitung) {
				el.value = el.value.split("\n").at(-1);
				this.sudahHitung = false;
			}
			el.value += teks;
		}
	}
}

// ===== Drag & drop untuk .file-field =====
(function () {
		const elemen = document.querySelector(".file-field");
		let isDragging = false;
		let offsetX = 0;
		let offsetY = 0;

		elemen.addEventListener("mousedown", (e) => {
				if (e.target.closest("video", "audio", ".badge")) return;
				isDragging = true;
				offsetX = e.clientX - elemen.offsetLeft;
				offsetY = e.clientY - elemen.offsetTop;
		});

		document.addEventListener("mousemove", (e) => {
				if (e.target.closest("video", "audio", ".badge")) return;
				if (!isDragging) return;
				elemen.style.left = `${e.clientX - offsetX}px`;
				elemen.style.top = `${e.clientY - offsetY}px`;
		});

		document.addEventListener("mouseup", () => {
				isDragging = false;
		});

		elemen.addEventListener("touchstart", (e) => {
				isDragging = true;
				const touch = e.touches[0];
				offsetX = touch.clientX - elemen.offsetLeft;
				offsetY = touch.clientY - elemen.offsetTop;
		});

		document.addEventListener("touchmove", (e) => {
				if (!isDragging) return;
				e.preventDefault();
				const touch = e.touches[0];
				elemen.style.left = `${touch.clientX - offsetX}px`;
				elemen.style.top = `${touch.clientY - offsetY}px`;
			}, { passive: false });

		document.addEventListener("touchend", () => {
				isDragging = false;
		});
})();
