async function reedem(kode, krj) {
	if (kosong(kode)) {
		await modalShow(gagal, "Anda harus memasukkan kode voucher terlebih dahulu");
		return null;
	}
	if (await modalShow(
		confirm,
		`Anda akan memakai voucher ${kode}. Harap tidak membatalkan transaksi setelah voucher dipakai. Voucher yang telah dipakai tidak bisa dikembalikan`
	)) {
		const cek = await postDataKedua("pakai_voucher", { kode_voucher: kode, keranjang: krj });
		let data = null;
		if (cek.stat.toLowerCase() === "berhasil") data = cek.data;
		await message(cek);
		return data;
	}
	return null;
}

async function cekVoucher(parent, keranjang, totalBelanja, totalQty, nama, kontak) {
	const ketentuan = await getData("ketentuan_voucher");
	const voucher = await getData("vouchers_data");
	const cs = await getData("customer");
	
	const sekarang = new Date();
	let vc = {};
	makeLabel("Dari daftar belanja Anda. Anda bisa mendapatkan salah satu dari voucher dibawah!", "teks", parent);
	for (const item of ketentuan) {
		const infoUmum = JSON.parse(item.info_umum);
		const syaratKlaim = JSON.parse(item.syarat_klaim);
		if (sekarang < new Date(infoUmum.start)) {
			let lolos = false, lolosKedua = false;
			if (syaratKlaim.penerima.toLowerCase() !== "semua pelanggan") {
				const name = nama.value.trim().toLowerCase();
				const contact = kontak.value.trim();
				const poin = cs.find(p => 
					p.nama.toLowerCase() === name &&
					p.kontak === contact
				)?.poin ?? 0;
				if (poin >= syaratKlaim.min_poin &&
					totalBelanja >= syaratKlaim.min_total &&
					totalQty >= syaratKlaim.min_qty
				) lolos = true;
			} else {
				if (
					totalBelanja >= syaratKlaim.min_total &&
					totalQty >= syaratKlaim.min_qty
				) lolos = true;
			}
			let iter = 0;
			
			for (const produk of keranjang) {
				if (syaratKlaim.produk_klaim.includes(produk.id)) {
					iter += 1;
					if (iter >= syaratKlaim.jumlah_beli) {
						lolosKedua = true;
						break;
					}
				}
			}
			
			if (lolos && lolosKedua) {
				parent.classList.remove("hidden");
				const cek = makeCekbox(parent, infoUmum.nama + " - " + infoUmum.nilai);
				vc[item.id_program] = cek;
			}
		}
	}
	return vc;
}

async function prepareIdDevice() {
	const idev = localStorage.getItem("id_device") ?? "";
	if (!idev.length) {
		const id = await getDt("make_id_device");
		localStorage.setItem("id_device", id.id);
		idDevice = id.id;		
	}
	idDevice = idev;
	const profil = await getData("profil");
	if (!(kosong(profil))) {
		const pr = profil[0];
		toko = pr.nama ?? "";
		alamatToko = pr.alamat ?? "";
		kontakToko = pr.kontak ?? "";
	}
}

function createNo() {
	const tipe1 = String(inisialCode).slice(0,1).toUpperCase();
	const tipe2 = Math.floor(Math.random() * 100) + 10;
	const tipe3 = Math.floor(Math.random() * 900000) + 100000;
	return String(tipe1) + String(tipe2) + "_" + String(tipe3);
}

async function cetakStruk(data, includingQr = true) {
    try {
        const keranjang = data.items || [];
        const map = {
            toko: toko,
            alamat: alamatToko,
            kontak: kontakToko,
            waktu: new Date().toLocaleString("id-ID"),
            no_trans: data.no_trans || "",
            operator: data.operator,
            total: formatMataUang(data.total || 0),
            bayar: formatMataUang(data.bayar || 0),
            kembali: formatMataUang(data.kembali || 0)
        };
        for (const [key, value] of Object.entries(map)) {
            document.getElementById(key).textContent = value;
        }

        const isi = document.getElementById("isi-keranjang");
        let for_isi = "";
        for (const item of keranjang) {
            for_isi += `${item.nama || ""} ${item.qty || 0}x = ${formatMataUang(item.subtotal_jual || 0)}<br>`;	
        }
        isi.innerHTML = for_isi;

        if (includingQr) {
            const elemenImg = document.getElementById("qr-struk");
            elemenImg.style.display = "block";
            const respon = await fetch(`${url}buat_qr_struk/${encodeURIComponent(data.no_trans || "")}`);
            if (!respon.ok) throw new Error("Gagal ambil QR");
            const blob = await respon.blob();
            if (elemenImg.dataset.url) URL.revokeObjectURL(elemenImg.dataset.url);
            const urlQr = URL.createObjectURL(blob);
            elemenImg.dataset.url = urlQr;
            elemenImg.src = urlQr;
            await elemenImg.decode();
        } else {
            document.getElementById("qr-struk").style.display = "none";
        }

        const daftarVoucher = data.voucher || [];

        if (daftarVoucher.length > 0) {
            const idProgram = daftarVoucher[0];
            const hasil = await postDataKedua("klaim_voucher", { id_program: idProgram });

            if (hasil && hasil.stat && hasil.stat.toLowerCase() === "berhasil") {
                const d = hasil.data;
                d["id_program"] = idProgram;

                const res = await fetch(url + "buat_qr_voucher", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(d),
                    credentials: "include"
                });
                if (!res.ok) throw new Error("Terjadi kesalahan saat mengambil kode QR");

                const blob = await res.blob();
                const urlImg = URL.createObjectURL(blob);
                const parent = document.getElementById("voucher-div");
                parent.classList.remove("hidden");
                parent.innerHTML = "";
                
                makeLabel("========== VOUCHER ===========", "teks", parent);
                makeLabel(d.nama_voucher, "teks", parent);
                const image = document.createElement("img");
                image.src = urlImg;
                image.style.width = "40mm";
                image.style.height = "40mm";
                parent.appendChild(image);
                makeLabel(d.kode_voucher, "teks", parent);
                makeLabel(d.tipe_voucher + " : " + (d.tipe_voucher.toLowerCase() === "diskon" ? d.nilai_voucher : formatMataUang(d.nilai_voucher)), "teks", parent);
                makeLabel("Berlaku: " + d.berlaku, "teks", parent);
                makeLabel("Tunjukkan QR Code ini ke kasir saat belanja berikutnya. Voucher tidak dapat diuangkan.", "teks", parent);
                makeLabel(`Info lebih lanjut hubungi ${kontakToko}`, "teks", parent);
                makeLabel("==============================", "teks", parent);
				
                image.onload = () => cetak("#struk");
                image.onerror = () => cetak("#struk");
            } else {
                cetak("#struk");
            }
        } else {
            cetak("#struk");
        }

    } catch (err) {
        await modalShow(error, err);
    }
}

class Transaksi {
	constructor() {
		this.isPending = false;
		this.bayar = 0;
		this.kembali = 0;
		this.noTrans = "";
		this.sudahBayar = 0;
		this.namaPembeli = "";
		this.nomorTelepon = "";
		this.persenPajak = 0;
		this.statusPajak = 0;
		this.totalBelanja = 0;
		this.hasilPencarian = [];
		this.hasil = [];
		this.arrUndo = [];
		this.arrRedo = [];
		this.dataPromo = null;
		this.infoPembeli = null;
		this.voc = null;
	}
	
	doUndo() {
		if (keranjang.length) {
			this.arrRedo.push(keranjang);
			keranjang = [];
		}
		if (this.arrUndo.length > 0) {
			const last = this.arrUndo.pop();
			keranjang = last;
			this.tambahkanSecondKeranjang();
		}
	}
	
	doRedo() {
		if (keranjang.length) {
			this.arrUndo.push(keranjang);
			keranjang = [];
		}
		if (this.arrRedo.length > 0) {
			const last = this.arrRedo.pop();
			keranjang = last;
			this.tambahkanSecondKeranjang();
		}
	}
	
	resetTransaksi() {
		if (keranjang.length) this.arrUndo.push(keranjang);
		keranjang = [];
		infoCadangan = {};
		secondKeranjang = [];
		this.bayar = 0;
		this.kembali = 0;
		this.sudahBayar = 0;
		this.namaPembeli = "";
		this.nomorTelepon = "";
		this.totalBelanja = 0;
		this.hasilPencarian = [];
		this.hasil = [];
		this.dataPromo = null;
		this.infoPembeli = null;
		this.voc = null;
		this.generateNoTrans();
		this.setLabelTotal();
		this.tambahkanSecondKeranjang();
		this.cari.focus();
	}

	tampilkanProduk() {
		const wadah = document.querySelector(".produk-pop");
		wadah.classList.remove("hidden");
		wadah.innerHTML = "";
		
		wadah.style.inset = "0";
		wadah.style.margin = "auto";
		wadah.style.minWidth = "80%";

		const tabel = makeTable(`
			<tr>
				<th>Barcode</th>
				<th>Nama produk</th>
				<th>Jumlah stok</th>
				<th>Harga jual</th>
				<th>Aksi</th>
			</tr>
		`);
		wadah.appendChild(tabel);
		for (const item of this.hasilPencarian.slice(0,10)) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.barcode}</td>
				<td>${item.nama}</td>
				<td>${item.jumlah} ${item.satuan_jual}</td>
				<td>${formatMataUang(item.harga_jual)}</td>
				<td style="display: flex; gap: 5px; background: transparent;">
					<input class="entry" type="number">
					<button class="btn" onclick="trx.tambahKeranjang('${item.id_produk}', this.previousElementSibling.value)">Tambah</button>
				</td>
			`;
			tabel.appendChild(tr);
			const inp = tr.querySelector("input");
			inp.enterKeyHint = "go";
			inp.addEventListener("keydown", (e) => {
				if (e.key === "Enter") {
					e.preventDefault();
					const val = safeInt(inp.value.trim());
					if (val <= 0) {
						const inputs = tabel.querySelectorAll("input");
						const idx = Array.from(inputs).indexOf(inp);
						const next = inputs[idx+1] || this.cari;
						next.focus();
					} else { this.tambahKeranjang(item.id_produk, val); }
				}
			});
		}
	}
	
	async tambahkanSecondKeranjang() {
		try {
			const hasilValidasi = await fetch(url + "tambahkan_second_keranjang", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify(keranjang)
			});
			const result = await hasilValidasi.json();
			this.totalBelanja = result.total;
			secondKeranjang = result.data || [];
			this.setLabelTotal();
			this.lihatKeranjang();
		} catch (err) {
			console.error(`Terjadi kesalahan pengolahan data: ${err}`)
			this.operasiSecondKeranjang();
			totalBelanja = secondKeranjang.reduce((sum, a) => sum + a.subtotal_jual, 0);
			this.labelTotal.textContent = "Total: " + formatMataUang(totalBelanja);
			this.lihatKeranjang(); 
		}
	}
	
	lihatKeranjang() {
		document.querySelector(".produk-pop").classList.add("hidden");
		const tbody = this.tabel.tBodies[0];
		tbody.innerHTML = "";
		this.cari.value = "";
		for (const item of secondKeranjang) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${item.barcode}</td>
				<td>${item.nama}</td>
				<td style="display: flex;">
					<button class="btns2" onclick="trx.operasiQty('${item.id}', '-')"><img class="icon" src="Pictures/minus.png"></button>
					<input type="number" id="input-qty" class="entry" value="${item.qty}"
						onkeydown="if(event.key==='Enter') trx.editQty('${item.id}', this.value)">
					<button class="btns2" onclick="trx.operasiQty('${item.id}', '+')"><img class="icon" src="Pictures/plus.png"></button>
				</td>
				<td>${formatMataUang(item.harga_jual)}</td>
				<td>${formatMataUang(item.subtotal_jual)}</td>
				<td>${item.tipe_promo}</td>
				<td>
					<img id="hapus-item" class="icon" onclick="trx.hapusKeranjang('${item.id}')">
				</td>
			`;
			this.tabel.appendChild(tr);
			tr.querySelector("#hapus-item").src = `Pictures/hapus.png`;
		}
		
	}
	
	async editQty(id, qty){
		console.log("fungsi terpanggil");
		const q = safeInt(qty);
		if (q <= 0){ keranjang = keranjang.filter(a => String(a.id) !== String(id)); return this.tambahkanSecondKeranjang(); }
		const findP = this.produk.find(produk => String(produk.id_produk) === String(id)) ?? Null;
		if (findP.jumlah >= q){
			const find = keranjang.find(a => String(a.id) === String(id)) ?? null;
			if (find){
				find.qty = q;
				this.tambahkanSecondKeranjang();
			}
		} else { await modalShow(gagal, "Jumlah stok tidak cukup"); }
	}
	
	hapusKeranjang(id) {
		keranjang = keranjang.filter(p => String(p.id) !== String(id));
		this.tambahkanSecondKeranjang();
	}
	
	operasiQty(id, tipe) {
		const item = keranjang.find(p => String(p.id) === String(id)) ?? null;
		if (!item) {
			return;
		}
		if (tipe === "-") {
			if (item.qty > 0) {
				item.qty -= 1;
			}
		} else {
			const jumlah = this.produk.find(p => String(p.id_produk) === String(id))?.jumlah ?? 0;
			if (item.qty < jumlah) {
				item.qty += 1;
			}
		}
		this.tambahkanSecondKeranjang();
	}
	
	async tambahKeranjang(id, qtyInp) {
		const qty = safeInt(qtyInp);
		const item = this.produk.find(p => String(p.id_produk) === String(id) || String(p.barcode) === String(id) || String(p.nama.toLowerCase()) === String(id.toLowerCase())) ?? null;
		if (item) {
			const foundKeranjang = keranjang.find(p => String(p.id) === String(item.id_produk)) ?? null;
			if (foundKeranjang) {
				const totalQty = foundKeranjang.qty + qty
				if (totalQty > item.jumlah) {
					await modalShow(gagal, "Stok produk tidak cukup");
					return
				}
				foundKeranjang["qty"] = totalQty;
			} else {
				if (qty > item.jumlah) {
					await modalShow(gagal, "Stok produk tidak cukup");
					return
				}
				keranjang.push({
					nama: item.nama,
					barcode: item.barcode,
					id: item.id_produk,
					qty: qty,
					harga: item.harga_jual
				});
			}
		} else {
			await modalShow(gagal, "Produk tidak ditemukan");
			return;
		}
		this.tambahkanSecondKeranjang();
	}
	
	searchProduk(teks="") {
		this.hasilPencarian.length = 0;
		if (teks === "") { document.querySelector(".produk-pop").classList.add("hidden"); return; }
		for (const item of this.produk) {
			if (
				item.nama.toLowerCase().includes(teks.toLowerCase()) ||
				item.barcode.includes(teks) ||
				item.id_produk.includes(teks) ||
				item.kategori.toLowerCase().includes(teks.toLowerCase())
			) {
				this.hasilPencarian.push(item);
			}
		}
		this.tampilkanProduk();
	}
	
	setupAtas() {
		this.atas.innerHTML = "";
		this.cari = entryMaker("Masukkan barcode atau nama...", "text", "Pictures/cari.png", this.atas);
		this.cari.enterKeyHint = "go";
		const infoImg = [
			["refresh.png", () => this.resetTransaksi()],
			["kembali.png", () => this.setup()]
		];
		for (const [name, command] of infoImg) {
			const img = document.createElement("img");
			img.className = "icon";
			img.src = `Pictures/${name}`;
			img.style.margin = "0 10px";
			img.onclick = () => {
				setTimeout(command, 300);
			};
			this.atas.appendChild(img);
		}
		
		this.cari.oninput = () => this.searchProduk(this.cari.value.trim());
		this.cari.addEventListener("keydown", (e) => {
			if (e.key === "Enter") {
				e.preventDefault();
				const val = this.cari.value.trim();
				if (val === "") { this.bayarInput.focus(); }
				else {
					const isBarcode = this.mapBarcode[val];
					if (!isBarcode) {
						const pop = document.querySelector(".produk-pop");
						const allInp = pop.querySelectorAll("input");
						if (allInp.length > 0)
							setTimeout(() => { allInp[0].focus(); }, 0);
					} else { this.tambahKeranjang(val,1); }
				}
			} else if (e.key === "Tab") {
				e.preventDefault();
				const inputQty = this.tabel.querySelectorAll("#input-qty");
				if (inputQty.length > 0){
					inputQty[0].focus();
				}
			} else if (e.ctrlKey && e.key.toLowerCase() === "p") {
				this.infoPembeli["nama pembeli"].focus();
			}
		});
		this.cari.focus();
	}

	setupBawah() {
		const p = document.getElementById("bawah-child");
		p.style.border = "none";
		p.style.background = "transparent";
		p.innerHTML = "";

		this.termasukPajak = makeCekTrx(p, "Termasuk pajak");
		this.labelNoTrans = makeLabel(`No: ${this.noTrans}`, "teks", p);
		
		for (const [id, pict, command] of [
			["kalk", "kalkulator.png", () => kalk.setup()],
			["undo", "undo.png", () => this.doUndo()],
			["redo", "redo.png", () => this.doRedo()]
		]) {
			const doc = document.getElementById(id);
			doc.src = `Pictures/${pict}`;
			doc.style.margin = "0 10px";
			doc.onclick = () => {
				setTimeout(command, 300);
			};
		}
		this.bawah.querySelectorAll(".label-data").forEach(item => {
			item.style.color = "black";
		});
		let aktif = false;
		if (!(kosong(this.pajak))) {
			aktif = [true, 1].includes(this.pajak[0].aktif) ? true : false;
		}
		this.termasukPajak.checked = aktif;
		this.termasukPajak.onchange = () => this.aktifkanPajak();

	setupTengah() {
		const pr = makeParent("container", this.tengah);
		this.tabel = makeTable(`
			<tr>
				<th>Barcode</th>
				<th>Nama produk</th>
				<th>Qty</th>
				<th>Harga</th>
				<th>Subtotal</th>
				<th>Tipe promo</th>
				<th>Aksi</th>
			</tr>
		`);
		pr.appendChild(this.tabel);

		const prt = makeParent("container-horizontal", this.tengah);

	setLabelTotal() {
		this.kananInfo.innerHTML = "";
		const hargaAsli = this.statusPajak === 1 ?
			this.totalBelanja / (1 + this.persenPajak / 100) :
			this.totalBelanja;
		const kenaPajak = this.totalBelanja - hargaAsli;
		const forTotal = this.totalBelanja - this.sudahBayar;
		
		this.labelAsli = makeLabel(`Subtotal: ${formatMataUang(Math.round(hargaAsli))}`, "teks", this.kananInfo);
		this.labelPpn = makeLabel(`PPN ${this.persenPajak}%: ${formatMataUang(Math.round(kenaPajak))}`, "teks", this.kananInfo);
		this.labelSudahBayar = makeLabel(`Sudah dibayar: ${formatMataUang(this.sudahBayar)}`, "teks", this.kananInfo);
		
		for (const i of [this.labelSudahBayar, this.labelPpn, this.labelAsli]) {
		 i.style.padding = "2px";
		 i.style.fontWeight = "450";
		 i.style.fontSize = ".95rem";
		}
		
		this.labelTotal = makeLabel(`Total: ${formatMataUang(forTotal)}`, "jdl", this.kananInfo);
		this.labelTotal.style.fontSize = "1.3rem";
		this.labelTotal.style.fontWeight = "700";
		this.bayarInput = entryMaker("Jumlah pembayaran", "number", "Pictures/banknotes.png", this.kananInfo);
		makeButton("btn", "Selesai", () => this.transaksiSelesai(), null, this.kananInfo);
		this.bayarInput.oninput = () => this.hitungKembalian(safeFloat(this.bayarInput.value.trim()));
		this.bayarInput.addEventListener("keydown", (e) => {
			if (e.key === "Enter") this.transaksiSelesai();
		});
	}
	
	async transaksiSelesai() {
		if (kosong(secondKeranjang)) {
			await modalShow(gagal, "Keranjang kosong");
			return;
		}
		const voucher = pecahCek(this.voc);
		if (voucher.length > 1) {
			await modalShow(gagal, "Anda tidak diizinkan mengklaim lebih dari satu voucher dalam sekali transaksi");
			return;
		}
		let jumlahBayar = this.sudahBayar + this.bayar;
		if (this.dataPromo && this.dataPromo.potongan) jumlahBayar += this.dataPromo.potongan;
		if (jumlahBayar < this.totalBelanja) {
			await modalShow(gagal, "Pembayaran tidak cukup");
			return;
		}
		const namaPembeli = this.infoPembeli["nama pembeli"].value.trim();
		const kontakPembeli = this.infoPembeli["nomor telepon"].value.trim();
		const pembeli = `${namaPembeli} ${kontakPembeli}`;
		const data = {
			items: secondKeranjang,
			total: this.totalBelanja,
			bayar: jumlahBayar,
			kembali: this.kembali,
			sumber: String(idDevice),
			operator: String(user),
			no_trans: this.noTrans,
			pembeli: pembeli,
			is_pending: this.isPending,
			voucher: voucher,
			data_promo: this.dataPromo
		}
		try {
			const res = await fetch(`${url}penjualan_campuran`, {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify(data)
			});
			
			const pesan = await res.json();
			if (pesan.stat.toLowerCase() === "berhasil") {
				if (await modalShow(pesan.stat, pesan.pesan, false)) {
					await cetakStruk(data);
					this.resetTransaksi();
				} else { this.resetTransaksi(); }
			} else { await modalShow(pesan.stat, pesan.pesan); }
		} catch {
			const trxOff = localStorage.getItem("transaksi_offline");
			const trans = trxOff ? JSON.parse(trxOff) : [];
			trans.push(data);
			localStorage.setItem("transaksi_offline", JSON.stringify(trans));
			if (await modalShow("Tersimpan", "Koneksi server terganggu. Riwayat transaksi telah disimpan sementara. Cetak struk penjualan?", false)) {
				await cetakStruk(data, false);
				this.resetTransaksi();
			} else { this.resetTransaksi(); }
		}
	}
	
	async aktifkanPajak() {
		const cek = this.termasukPajak.checked;
		await postDataKedua("pajak_selalu_aktif", {aktif: cek});
		this.statusPajak = cek === true ? 1 : 0;
	}
	
	hitungKembalian(bayar) {
		if (bayar === 0) {
			this.labelTotal.textContent = `Total: ${formatMataUang(this.totalBelanja)}`;
			this.labelTotal.style.color = primary;
			return;
		}
		this.bayar = bayar;
		if (this.dataPromo && this.dataPromo.potongan) this.bayar += this.dataPromo.potongan;
		const totalAsli = this.totalBelanja - this.sudahBayar;
		this.kembali = this.bayar - totalAsli;
		let warna = this.kembali >= 0 ? "green" : "red";
		this.labelTotal.textContent = `Kembali: ${formatMataUang(this.kembali)}`;
		this.labelTotal.style.color = warna;
	}
	
	async reedemVoucher(kode) {
		this.dataPromo = await reedem(kode, secondKeranjang);
		if (this.dataPromo && this.dataPromo.potongan) {
			const tb = this.totalBelanja - this.sudahBayar - this.dataPromo.potongan;
			if (this.sudahBayar === 0) {
				this.labelTotal.textContent = `Total: ${formatMataUang(tb)}`;
			} else {
				this.labelTotal.textContent = `Belum dibayar: ${formatMataUang(tb)}`;
			}
		}
	}
	
	setPembayaran() {
		this.infoPembeli = pembuatEntry(this.kiriInfo, [
			["nama pembeli", "Nama pembeli...", "text"],
			["nomor telepon", "Nomor telepon...", "number"]
		]);
		const reedemFr = makeParent("container-horizontal", this.kiriInfo);
		const kodeInput = entryMaker("Masukkan kode voucher...", "text", "Pictures/voucher.png", reedemFr);
		makeButton("btn", "Reedem", () => this.reedemVoucher(kodeInput.value.trim()), null, reedemFr);
		makeButton("btn", "Cek", () => this.periksaVoucher(), null, reedemFr);
		reedemFr.style.flexWrap = "nowrap";
		reedemFr.style.border = "none";
		reedemFr.style.padding = "3px";
	}
	
	async periksaVoucher() {
		const wadah = pembuatJendela();
		const totalQty = secondKeranjang.reduce((sum, b) => sum + b.qty_asli,0);
		this.voc = await cekVoucher(
			wadah, secondKeranjang, this.totalBelanja,
			totalQty, this.infoPembeli["nama pembeli"], this.infoPembeli["nomor telepon"]
		);
	}
	
	generateNoTrans() {
		this.noTrans = createNo();
		this.labelNoTrans.textContent = `No: ${this.noTrans}`;
	}
	
	cekInfoCadangan() {
		if (kosong(infoCadangan)) return;
		const i = infoCadangan;
		this.isPending = i.is_pending;
		this.infoPembeli["nama pembeli"].value = i.pembeli;
		this.noTrans = i.no_trans;
		this.sudahBayar = i.sudah_bayar;
		this.labelNoTrans.textContent = this.noTrans;
	}
	
	async setup() {
		this.produk = await getData("produk");
		this.pajak = await getData("pajak");
		this.qr = await getData("status_qr");
		this.A = await getData("tingkat_a");
		this.B = await getData("tingkat_b");
		this.diskon = await getData("produk_diskon");
		this.mapBarcode = Object.fromEntries(this.produk.map(p => [p.barcode, p]));
		
		if (!(kosong(this.pajak))) {
			this.persenPajak = this.pajak[0].persen;
			this.statusPajak = this.pajak[0].aktif;
		}
		this.atas = document.getElementById("atas-parent");
		this.tengah = document.getElementById("tengah");
		this.tengah.innerHTML = "";
		this.bawah = document.getElementById("bawah");
		hideWindow();
		this.setupAtas();
		this.setupBawah();
		this.setupTengah();
		this.generateNoTrans();
		this.setLabelTotal();
		this.setPembayaran();
		this.cekInfoCadangan();
		this.tambahkanSecondKeranjang();
	}
}

class SetupKiri {

	}
	
	async daftarProduk() {
		const produk = await getData("produk");
		const p = pembuatJendela();
		makeLabel("Daftar produk", "teks", p);
		const pr1 = makeParent("container-horizontal", p);
		this.cari = entryMaker("Masukkan nama atau barcode...", "text", "Pictures/cari.png", pr1);
		makeButton("btn", "Cari", null, null, pr1);
		
		const pr2 = makeParent("container", p);
		this.tabelProduk = makeTable(`
			<tr>
				<th>Barcode</th>
				<th>Nama produk</th>
				<th>Jumlah stok</th>
				<th>Harga jual</th>
				<th>Aksi</th>
			</tr>
		`);
		pr2.appendChild(this.tabelProduk);
		this.cari.oninput = () => this.cariProduk(produk, this.cari.value.trim());

			if (e.key === "Enter" || e.key === "ArrowDown") {

			}

	async tambahKeranjang(produk, val) {
		const find = keranjang.find(p => p.id === produk.id_produk);
		if (find) {
			const qtyTotal = find.qty + val;
			if (qtyTotal > produk.jumlah) {
				await modalShow(gagal, "Stok tidak cukup");
				return;
			}
			find.qty = qtyTotal;
		} else {
			if (val > produk.jumlah) {
				await modalShow(gagal, "Stok tidak cukup");
				return;
			}
			keranjang.push({
				id: produk.id_produk,
				nama: produk.nama,
				barcode: produk.barcode,
				qty: val,
				harga: produk.harga_jual
			});
		}
		trx.setup();
	}
	
	cariProduk(produk, val="") {
		let data = produk.filter(p =>
			(p.nama.toLowerCase().includes(val.toLowerCase())) ||
			(p.barcode.includes(val))
		);
		const body = this.tabelProduk.tBodies[0];
		body.innerHTML = "";
		for (const obj of data.slice(0,10)) {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>${obj.barcode}</td>
				<td>${obj.nama}</td>
				<td>${obj.jumlah} ${obj.satuan_jual}</td>
				<td>${formatMataUang(obj.harga_jual)}</td>
				<td style="display: flex; gap: 10px;">
					<input class="entry" type="number">
					<button class="btn" onclick="setKir.tambahKeranjang('${obj}', this.previousElementSibling.value)">Tambah</button>
				</td>
			`;
			this.tabelProduk.appendChild(tr);
			
			const inp = tr.querySelector("input");
			inp.enterKeyHint = "go";
			inp.addEventListener("keydown", (e) => {
				if (e.key === "Enter" || e.key === "ArrowDown") {
					e.preventDefault();
					const val = safeInt(inp.value.trim());
					if (val <= 0) {
						const inputs = this.tabelProduk.querySelectorAll("input");
						const idx = Array.from(inputs).indexOf(inp);
						const next = inputs[idx+1] || this.cari;
						next.focus();
					} else {
						this.tambahKeranjang(obj, val);
					}
				}
			});
		}

			const pRect = p.getBoundingClientRect();	
			p.style.top = `${rect.top - pRect.height - 0.5}px`;
		};
	}
}
